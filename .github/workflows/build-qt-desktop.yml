name: build-qt-desktop

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: "构建全部 4 个组合（忽略下面的 target）"
        required: false
        type: boolean
        default: false
      target:
        description: "构建目标（Qt 版本 + 编译器）"
        required: false
        type: choice
        default: "qt6-mingw1510_64"
        options:
          - qt5-msvc2026_64
          - qt5-mingw810_64
          - qt6-mingw1510_64
          - qt6-msvc2026_64
      linkage:
        description: "链接方式"
        required: false
        type: choice
        default: "shared-debug-and-release"
        options:
          - shared-debug-and-release
          - static-release
      skip_modules:
        description: "要跳过的模块与特性（空格分隔）：模块名走 -skip，以 - 开头的原样传给 configure（仅 Qt6 生效）。默认沿用 Android 流程调过的集合，让完整构建能在 6 小时 job 上限内完成"
        required: false
        default: "qtgrpc qtserialbus qtscxml qtopcua qtremoteobjects qtactiveqt qtwayland qttasktree qtcoap qtwebchannel -no-feature-printsupport -no-feature-spatialaudio -no-feature-tiff -no-feature-sql-psql -no-feature-sql-mysql -no-feature-sql-odbc -no-feature-sql-oci -no-feature-sql-db2 -no-feature-sql-ibase -no-feature-sql-mimer -no-feature-cups -no-feature-pkg-config"
      make_examples_tests:
        description: "是否编译 examples 与 tests（默认不编，产物更小）"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "qt-desktop-*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      linkage: ${{ steps.plan.outputs.linkage }}
      skip_modules: ${{ steps.plan.outputs.skip_modules }}
      make_examples_tests: ${{ steps.plan.outputs.make_examples_tests }}
    steps:
      - name: Compute build matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          TARGETS='[
            {"target":"qt5-msvc2026_64","qt_version":"5.15.19","qt_major":"5.15","compiler":"msvc2026_64","toolchain":"msvc","runner":"windows-2025-vs2026","platform":"win32-msvc"},
            {"target":"qt5-mingw810_64","qt_version":"5.15.19","qt_major":"5.15","compiler":"mingw810_64","toolchain":"mingw","runner":"windows-2022","platform":"win32-g++"},
            {"target":"qt6-mingw1510_64","qt_version":"6.12.1","qt_major":"6.12","compiler":"mingw1510_64","toolchain":"mingw","runner":"windows-2022","platform":"win32-g++"},
            {"target":"qt6-msvc2026_64","qt_version":"6.12.1","qt_major":"6.12","compiler":"msvc2026_64","toolchain":"msvc","runner":"windows-2025-vs2026","platform":"win32-msvc"}
          ]'
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.build_all }}" = "true" ]; then
            SELECTED="$TARGETS"
          else
            SELECTED=$(echo "$TARGETS" | jq -c --arg t "${{ inputs.target || 'qt6-mingw1510_64' }}" 'map(select(.target == $t))')
          fi
          if [ "$(echo "$SELECTED" | jq 'length')" -eq 0 ]; then
            echo "Unknown target" >&2
            exit 1
          fi
          echo "matrix=$(echo "$SELECTED" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "linkage=${{ inputs.linkage || 'shared-debug-and-release' }}" >> "$GITHUB_OUTPUT"
          echo "skip_modules=${{ inputs.skip_modules || 'qtgrpc qtserialbus qtscxml qtopcua qtremoteobjects qtactiveqt qtwayland qttasktree qtcoap qtwebchannel -no-feature-printsupport -no-feature-spatialaudio -no-feature-tiff -no-feature-sql-psql -no-feature-sql-mysql -no-feature-sql-odbc -no-feature-sql-oci -no-feature-sql-db2 -no-feature-sql-ibase -no-feature-sql-mimer -no-feature-cups -no-feature-pkg-config' }}" >> "$GITHUB_OUTPUT"
          echo "make_examples_tests=${{ inputs.make_examples_tests || false }}" >> "$GITHUB_OUTPUT"
          echo "Build plan: $(echo "$SELECTED" | jq -c .)"

  build:
    needs: prepare
    name: ${{ matrix.target }} / ${{ needs.prepare.outputs.linkage }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      QT_VERSION: ${{ matrix.qt_version }}
      QT_MAJOR_MINOR: ${{ matrix.qt_major }}
      COMPILER: ${{ matrix.compiler }}
      TOOLCHAIN: ${{ matrix.toolchain }}
      PLATFORM_SPEC: ${{ matrix.platform }}
      LINKAGE: ${{ needs.prepare.outputs.linkage }}
      SKIP_MODULES: ${{ needs.prepare.outputs.skip_modules }}
      MAKE_EXAMPLES_TESTS: ${{ needs.prepare.outputs.make_examples_tests }}
      WORK_ROOT: D:\qt-desktop
      ARCHIVE_DIR: D:\qt-desktop\archives
      SRC_ROOT: D:\qt-desktop\src
      TOOLS_DIR: D:\qt-desktop\tools
      BUILD_DIR: D:\qt-desktop\build
      PREFIX: D:\qt-desktop\install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Qt source archive
        uses: actions/cache@v6
        with:
          path: D:\qt-desktop\archives
          key: qt-desktop-src-${{ matrix.qt_version }}-v1

      - name: Setup Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          architecture: x64

      - name: Install build tools (CMake / Ninja / Perl / MinGW)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-File([string]$Url, [string]$Out) {
            curl.exe -L --fail --retry 5 --retry-delay 10 --max-time 1800 -o $Out $Url
            if ($LASTEXITCODE -ne 0) { throw "下载失败: $Url" }
            $global:LASTEXITCODE = 0
          }
          New-Item -ItemType Directory -Force -Path $env:TOOLS_DIR, $env:ARCHIVE_DIR, $env:SRC_ROOT | Out-Null

          # CMake 4.3.2（Qt 6.12 官方版本页）；Qt5 不用 CMake，但统一安装便于校验
          Get-File 'https://github.com/Kitware/CMake/releases/download/v4.3.2/cmake-4.3.2-windows-x86_64.zip' "$env:TOOLS_DIR\cmake.zip"
          Expand-Archive "$env:TOOLS_DIR\cmake.zip" "$env:TOOLS_DIR\cmake-tmp" -Force
          Move-Item "$env:TOOLS_DIR\cmake-tmp\cmake-4.3.2-windows-x86_64" "$env:TOOLS_DIR\cmake" -Force

          # Ninja 1.10.2：Qt6 检测到 ninja 且需要 debug-and-release 时会自动切到 Ninja Multi-Config
          Get-File 'https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip' "$env:TOOLS_DIR\ninja.zip"
          Expand-Archive "$env:TOOLS_DIR\ninja.zip" "$env:TOOLS_DIR\ninja" -Force

          # Strawberry Perl（Qt 构建脚本依赖）
          Get-File 'https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54221_64bit/strawberry-perl-5.42.2.1-64bit-portable.zip' "$env:TOOLS_DIR\perl.zip"
          Expand-Archive "$env:TOOLS_DIR\perl.zip" "$env:TOOLS_DIR\strawberry" -Force

          $path = @(
            "$env:TOOLS_DIR\cmake\bin",
            "$env:TOOLS_DIR\ninja",
            "$env:TOOLS_DIR\strawberry\c\bin",
            "$env:TOOLS_DIR\strawberry\perl\bin"
          )

          if ($env:TOOLCHAIN -eq 'mingw') {
            if ($env:COMPILER -eq 'mingw810_64') {
              $mingwUrl = 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/tools_mingw81/qt.tools.win64_mingw810/8.1.0-1-202411201005x86_64-8.1.0-gdb-11.2.0-release-posix-seh-rt_v6-rev0.7z'
            } else {
              $mingwUrl = 'https://github.com/niXman/mingw-builds-binaries/releases/download/15.1.0-rt_v12-rev0/x86_64-15.1.0-release-posix-seh-msvcrt-rt_v12-rev0.7z'
            }
            Get-File $mingwUrl "$env:TOOLS_DIR\mingw.7z"
            # Qt 在线仓库的 8.1.0 包把 bin/ 直接放在压缩包根；niXman 15.1.0 包带 mingw64/ 顶层目录
            $mingwOut = if ($env:COMPILER -eq 'mingw810_64') { "$env:TOOLS_DIR\mingw64" } else { $env:TOOLS_DIR }
            & 7z x -y "-o$mingwOut" "$env:TOOLS_DIR\mingw.7z" | Out-Null
            if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0; throw "MinGW 解压失败" }
            $path += "$env:TOOLS_DIR\mingw64\bin"
          }
          $path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $global:LASTEXITCODE = 0

          & cmake --version
          & ninja --version
          & perl -v | Select-Object -First 2
          if ($env:TOOLCHAIN -eq 'mingw') { & g++ --version | Select-Object -First 1 }
          $global:LASTEXITCODE = 0

      # 必须放在工具安装之后：安装步骤会把 strawberry\c\bin（内含老版 c++.exe）写进 GITHUB_PATH，
      # 后写入的 PATH 条目排在前面；若先初始化 MSVC，cl.exe 会被 Strawberry 的 MinGW 盖掉，
      # Qt6 configure 就会误选 GNU 编译器（报 GetThreadDescription 未定义）。
      # 不依赖 ilammy/msvc-dev-cmd：该 action 的 vswhere 版本区间上限 18.9 匹配不到 VS 2026 的 18.12.x。
      - name: Set up MSVC 2026 (x64)
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcvars = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\18\*\VC\Auxiliary\Build\vcvars64.bat' -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -First 1
          if (-not $vcvars) { throw '未找到 VS 2026 的 vcvars64.bat（预期在 C:\Program Files\Microsoft Visual Studio\18\<Edition>\VC\Auxiliary\Build）' }
          Write-Output "vcvars64: $($vcvars.FullName)"
          $lines = & cmd.exe /c "`"$($vcvars.FullName)`" x64 && set"
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0; throw 'vcvars64.bat 执行失败' }

          $before = [System.Collections.Generic.Dictionary[string,string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }

          $newPath = @()
          foreach ($line in $lines) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $key, $value = $Matches[1], $Matches[2]
            if ($key -eq 'Path') {
              $newPath = @($value -split ';' | Where-Object { $_ -and ($before['Path'] -notlike "*$_*") })
              continue
            }
            if ($key -match '^(GITHUB_|RUNNER_|ACTIONS_|CI$|PWD$|SHLVL$|PSModulePath$|TERM$|TZ$)') { continue }
            if (-not $before.ContainsKey($key) -or $before[$key] -ne $value) {
              "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          # Debug 版 Qt 工具（rcc/moc/uic）需要调试 CRT：vcvars 不会把 debug_nonredist
          # 与 ucrtbased.dll 所在目录加进 PATH，缺失时 rcc.exe 会以 0xc0000135 退出。
          $debugDirs = @()
          $debugDirs += Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\18\*\VC\Redist\MSVC\*\debug_nonredist\x64\Microsoft.*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $debugDirs += Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio\18\*\VC\Redist\MSVC\*\debug_nonredist\x64\Microsoft.*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $debugDirs += Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\ucrtbased.dll' -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Directory.FullName }
          $debugDirs += Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\ucrt\x64\ucrtbased.dll' -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Directory.FullName }
          $debugDirs += Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Redist\ucrt\DLLs\x64\ucrtbased.dll' -File -ErrorAction SilentlyContinue | ForEach-Object { $_.Directory.FullName }
          $debugDirs = @($debugDirs | Where-Object { $_ } | Select-Object -Unique)
          if ($debugDirs.Count -eq 0) { Write-Warning '未找到 MSVC 调试运行库目录；Debug 版 Qt 工具可能以 0xc0000135 失败' }
          Write-Output "Debug CRT dirs: $($debugDirs -join '; ')"
          $newPath = @($debugDirs) + $newPath

          if ($newPath.Count -gt 0) {
            # GITHUB_PATH 只对后续 step 生效；当前 step 也要立刻能看到 cl.exe
            $env:Path = (($newPath + ($env:Path -split ';')) | Where-Object { $_ } | Select-Object -Unique) -join ';'
            $newPath | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          $global:LASTEXITCODE = 0
          & cl.exe /? | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0; throw 'cl.exe 不可用' }
          $global:LASTEXITCODE = 0

          # 双保险：显式固定 CMake 的 C/CXX 编译器为 cl，避免 VS2026 的 vcvars 把
          # VC\Tools\Llvm\x64\bin（clang）加进 PATH 后被 CMake 自动探测选中。
          $env:CC = 'cl'
          $env:CXX = 'cl'
          "CC=cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch and extract Qt sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-File([string]$Url, [string]$Out) {
            curl.exe -L --fail --retry 5 --retry-delay 10 --max-time 2400 -o $Out $Url
            if ($LASTEXITCODE -ne 0) { throw "下载失败: $Url" }
            $global:LASTEXITCODE = 0
          }
          if ($env:QT_MAJOR_MINOR -eq '5.15') {
            $name = "qt-everywhere-opensource-src-$env:QT_VERSION.zip"
            $url = "https://download.qt.io/archive/qt/5.15/$env:QT_VERSION/single/$name"
          } else {
            $name = "qt-everywhere-src-$env:QT_VERSION.zip"
            $url = "https://download.qt.io/official_releases/qt/6.12/$env:QT_VERSION/single/$name"
          }
          $archive = Join-Path $env:ARCHIVE_DIR $name
          if (-not (Test-Path $archive)) { Get-File $url $archive }
          $root = Join-Path $env:SRC_ROOT "qt-everywhere-src-$env:QT_VERSION"
          if (-not (Test-Path (Join-Path $root 'configure.bat'))) {
            Write-Output "解压源码: $archive -> $env:SRC_ROOT"
            & 7z x -y "-o$env:SRC_ROOT" $archive | Out-Null
            if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0; throw "源码解压失败" }
          }
          if (-not (Test-Path (Join-Path $root 'configure.bat'))) { throw "源码目录异常: $root" }
          $global:LASTEXITCODE = 0
          Write-Output "源码就绪: $root"
          "QT_SRC=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-PSDrive D | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table

      - name: Configure / build / install Qt (Qt 5 qmake)
        if: matrix.qt_major == '5.15'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:PREFIX $env:COMPILER
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          $skipArgs = @()
          foreach ($m in ($env:SKIP_MODULES -split '[\s,]+' | Where-Object { $_ })) {
            # -no-feature-* 是 Qt6 的开关名，Qt5 的同名 feature 不一定存在，忽略以免误配
            if ($m.StartsWith('-')) { Write-Output "Qt5 忽略 feature 开关: $m"; continue }
            if (-not (Test-Path (Join-Path $env:QT_SRC $m))) { Write-Output "跳过不存在的模块: $m"; continue }
            $skipArgs += @('-skip', $m)
          }
          $cfg = @('-opensource', '-confirm-license', "-prefix", $prefix, '-platform', $env:PLATFORM_SPEC)
          if ($env:LINKAGE -eq 'static-release') {
            $cfg += @('-static', '-release')
            if ($env:TOOLCHAIN -eq 'msvc') { $cfg += '-static-runtime' }
          } else {
            $cfg += @('-shared', '-debug-and-release')
          }
          if ($env:MAKE_EXAMPLES_TESTS -ne 'true') { $cfg += @('-nomake', 'examples', '-nomake', 'tests') }
          $cfg += $skipArgs
          $cfg += @('-qt-libpng', '-qt-libjpeg', '-qt-zlib', '-qt-pcre', '-qt-freetype', '-schannel', '-opengl', 'desktop')

          New-Item -ItemType Directory -Force -Path $env:BUILD_DIR | Out-Null
          Push-Location $env:BUILD_DIR
          try {
            $cfgLine = ($cfg | ForEach-Object { '"' + $_ + '"' }) -join ' '
            "configure: $cfgLine" | Out-File -FilePath "$env:WORK_ROOT\configure-command.txt" -Encoding utf8
            Write-Output "configure: $cfgLine"
            & (Join-Path $env:QT_SRC 'configure.bat') @cfg
            if ($LASTEXITCODE -ne 0) { throw "Qt5 configure 失败" }
            $make = if ($env:TOOLCHAIN -eq 'msvc') { 'nmake' } else { 'mingw32-make' }
            $jobs = "$env:NUMBER_OF_PROCESSORS"
            & $make "-j$jobs"
            if ($LASTEXITCODE -ne 0) { throw "Qt5 编译失败" }
            & $make install
            if ($LASTEXITCODE -ne 0) { throw "Qt5 安装失败" }
          } finally {
            Pop-Location
            $global:LASTEXITCODE = 0
          }
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure / build / install Qt (Qt 6 CMake)
        if: matrix.qt_major == '6.12'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:PREFIX $env:COMPILER
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          # Ninja 会直接调用 build/qtbase/bin/<Config> 下的 rcc/moc/uic；它们依赖同配置的 Qt6*.dll（在 lib/<Config>）。
          # 这些目录不在默认 PATH 里，缺失时表现为 0xc0000135（DLL not found）。
          $qtBuildBins = @(
            "$env:BUILD_DIR\qtbase\lib\Debug", "$env:BUILD_DIR\qtbase\bin\Debug",
            "$env:BUILD_DIR\qtbase\lib\Release", "$env:BUILD_DIR\qtbase\bin\Release",
            "$env:BUILD_DIR\qtbase\lib", "$env:BUILD_DIR\qtbase\bin"
          )
          $env:Path = (($qtBuildBins + ($env:Path -split ';')) | Where-Object { $_ } | Select-Object -Unique) -join ';'

          # Qt 6.12.1 在 Ninja Multi-Config + -debug-and-release 下，部分自包含 QML
          # 工具模块（已知 qmltime）的 .qmltypes 生成目标未纳入构建图，但 install
          # 规则仍引用它，导致 file(INSTALL) 因源文件缺失而失败（报错里的
          # "File exists" 只是残留 errno，真实原因是文件不存在）。
          # 扫描所有 install 脚本，为缺失的 .qmltypes 补一个最小合法占位文件。
          function Ensure-QmltimeTypes {
            $fixed = 0
            $scripts = Get-ChildItem -LiteralPath $env:BUILD_DIR -Filter 'cmake_install.cmake' -Recurse -File -ErrorAction SilentlyContinue
            foreach ($s in $scripts) {
              $content = Get-Content -LiteralPath $s.FullName -Raw -Encoding UTF8
              foreach ($m in [regex]::Matches($content, '"([^"]+\.qmltypes)"')) {
                $p = $m.Groups[1].Value
                if (-not (Test-Path -LiteralPath $p)) {
                  $dir = Split-Path -Parent $p
                  New-Item -ItemType Directory -Force -Path $dir | Out-Null
                  @('import QtQml', 'Module {', '    name: "QmlTime"', '    isComposite: true', '}') | Out-File -FilePath $p -Encoding ascii
                  Write-Output "补齐缺失 qmltypes: $p"
                  $fixed++
                }
              }
            }
            Write-Output "qmltypes 占位补齐: $fixed 个"
          }

          $skipArgs = @()
          $featureArgs = @()
          foreach ($m in ($env:SKIP_MODULES -split '[\s,]+' | Where-Object { $_ })) {
            # 与 Android 流程一致：以 - 开头的是 configure 原始开关（如 -no-feature-tiff），
            # 其余按 -skip 模块处理；源码里不存在的模块直接忽略，兼容 Qt5/Qt6 差异。
            if ($m.StartsWith('-')) { $featureArgs += $m; continue }
            if (-not (Test-Path (Join-Path $env:QT_SRC $m))) { Write-Output "跳过不存在的模块: $m"; continue }
            $skipArgs += @('-skip', $m)
          }
          # Qt6 configure 依赖 -platform <mkspec> 来推导编译器（win32-msvc -> cl，win32-g++ -> g++）。
          # 不能用 -DCMAKE_CXX_COMPILER=cl.exe：configure.bat 会把 -D 收进 QT_EXTRA_DEFINES（编译宏），
          # 于是 CMake 自行探测，在 VS2026 环境里会选中 vcvars 加入 PATH 的 clang（win32-clang-msvc），
          # 进而触发 STL1009 与 WinRT 私有头缺失。
          $cfg = @('-opensource', '-confirm-license', '-prefix', $prefix, '-platform', $env:PLATFORM_SPEC, '-opengl', 'desktop')
          if ($env:LINKAGE -eq 'static-release') {
            $cfg += @('-static', '-release')
            if ($env:TOOLCHAIN -eq 'msvc') { $cfg += '-static-runtime' }
            $cfg += '-DFEATURE_relocatable=ON'
          } else {
            $cfg += @('-shared', '-debug-and-release')
          }
          if ($env:MAKE_EXAMPLES_TESTS -ne 'true') { $cfg += @('-nomake', 'examples', '-nomake', 'tests') }
          $cfg += $featureArgs
          $cfg += $skipArgs

          New-Item -ItemType Directory -Force -Path $env:BUILD_DIR | Out-Null
          Push-Location $env:BUILD_DIR
          try {
            $cfgLine = ($cfg | ForEach-Object { '"' + $_ + '"' }) -join ' '
            "configure: $cfgLine" | Out-File -FilePath "$env:WORK_ROOT\configure-command.txt" -Encoding utf8
            Write-Output "configure: $cfgLine"
            & (Join-Path $env:QT_SRC 'configure.bat') @cfg
            if ($LASTEXITCODE -ne 0) { throw "Qt6 configure 失败" }
            # 参考 yuanpeirong/buildQt 的 shared-debug-and-release 分支：
            # 用 cmake --build . --parallel（不显式指定 config）+ ninja install。
            # 参考项目注释指出 cmake --install 会漏装文件，ninja install 才完整。
            & cmake --build . --parallel
            if ($LASTEXITCODE -ne 0) { throw "Qt6 编译失败" }
            Ensure-QmltimeTypes
            & ninja install
            if ($LASTEXITCODE -ne 0) { throw "Qt6 安装失败" }

            # 兜底：debug-and-release 必须同时有 Debug/Release 的核心库。
            # 某些生成器配置下 ninja install 只装默认配置，这里补编+补装缺失的那个。
            if ($env:LINKAGE -eq 'shared-debug-and-release') {
              foreach ($config in @('Debug', 'Release')) {
                $suffix = if ($config -eq 'Debug') { 'd' } else { '' }
                $marker = if ($env:LINKAGE -eq 'static-release') {
                  Join-Path $prefix "lib\libQt6Core$suffix.a"
                } else {
                  Join-Path $prefix "bin\Qt6Core$suffix.dll"
                }
                if (-not (Test-Path -LiteralPath $marker)) {
                  Write-Output "补齐缺失配置: $config（未找到 $marker）"
                  & cmake --build . --config $config --parallel
                  if ($LASTEXITCODE -ne 0) { throw "Qt6 补编译失败 ($config)" }
                  Ensure-QmltimeTypes
                  & cmake --install . --config $config
                  if ($LASTEXITCODE -ne 0) { throw "Qt6 补安装失败 ($config)" }
                }
              }
            }
            # 与参考项目一致：前缀自带 qt.conf，保证解压后 qmake/qmake6 能定位 prefix
            "[paths]`nPrefix = .." | Set-Content -Path (Join-Path $prefix 'bin\qt.conf') -Encoding ASCII
          } finally {
            Pop-Location
            $global:LASTEXITCODE = 0
          }
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Write BUILD-INFO.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(
            "Qt version: $env:QT_VERSION",
            "Target: $env:COMPILER",
            "Linkage: $env:LINKAGE",
            "Runner: ${{ matrix.runner }}",
            "Skipped modules: $env:SKIP_MODULES",
            "Configure: $(Get-Content "$env:WORK_ROOT\configure-command.txt" -Raw)"
          )
          if ($env:TOOLCHAIN -eq 'msvc') {
            $lines += "Compiler: $(& cl 2>&1 | Select-Object -First 1)"
          } else {
            $lines += "Compiler: $(& g++ --version | Select-Object -First 1)"
          }
          $lines | Out-File -FilePath (Join-Path $env:QT_PREFIX 'BUILD-INFO.txt') -Encoding utf8 -Append
          $global:LASTEXITCODE = 0

      - name: Free disk space before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Show-FreeSpace([string]$stage) {
            $d = Get-PSDrive D
            Write-Output "[$stage] D: free $([math]::Round($d.Free/1GB,2)) GB / used $([math]::Round($d.Used/1GB,2)) GB"
          }
          Show-FreeSpace 'before cleanup'
          function Remove-Tree([string]$dir) {
            if (-not (Test-Path -LiteralPath $dir)) { return }
            Write-Output "removing $dir"
            Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $dir) {
              # Qt 构建目录里常有超过 MAX_PATH 的嵌套路径；robocopy 空目录镜像比
              # Remove-Item 更能可靠清空这种目录树。
              $empty = Join-Path $env:WORK_ROOT '__empty'
              New-Item -ItemType Directory -Force -Path $empty | Out-Null
              & robocopy $empty $dir /MIR /NFL /NDL /NJH /NJS /NP /R:0 /W:0 | Out-Null
              $global:LASTEXITCODE = 0
              Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $dir) { Write-Warning "无法删除 $dir；磁盘空间可能仍然不足" }
          }
          # install 完成后 build 树与源码树都不再需要。Qt6 debug+release 全量构建
          # 的 build 目录通常十几 GB，是 7z 阶段 "There is not enough space on the disk"
          # 的主要原因；源码压缩包仍在 ARCHIVE_DIR 缓存里，不影响后续复用。
          foreach ($dir in @($env:BUILD_DIR, $env:QT_SRC, "$env:TOOLS_DIR\cmake-tmp")) {
            Remove-Tree $dir
          }
          foreach ($pattern in @('*.zip', '*.7z')) {
            Get-ChildItem -Path $env:TOOLS_DIR -Filter $pattern -File -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
          Show-FreeSpace 'after cleanup'
          $global:LASTEXITCODE = 0

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outdir = Join-Path $env:WORK_ROOT 'artifacts'
          New-Item -ItemType Directory -Force -Path $outdir | Out-Null
          $name = "Qt_${env:QT_VERSION}-${env:LINKAGE}_${env:COMPILER}.7z"
          $archive = Join-Path $outdir $name
          $freeGB = [math]::Round((Get-PSDrive D).Free/1GB, 2)
          $srcGB = [math]::Round(((Get-ChildItem -LiteralPath $env:QT_PREFIX -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum)/1GB, 2)
          Write-Output "打包前检查: 安装目录 ${srcGB} GB, D: 可用 ${freeGB} GB"
          if ($freeGB -lt ($srcGB * 1.2 + 2)) {
            throw "D: 可用空间不足（安装目录 ${srcGB} GB，可用 ${freeGB} GB），无法创建压缩包"
          }
          & 7z a -t7z -mx=5 $archive "$env:QT_PREFIX"
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0; throw "打包失败" }
          $global:LASTEXITCODE = 0
          Get-Item -LiteralPath $archive | Select-Object FullName, @{n='SizeGB';e={[math]::Round($_.Length/1GB,2)}} | Format-List
          "ARTIFACT=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Qt_${{ matrix.qt_version }}-${{ needs.prepare.outputs.linkage }}_${{ matrix.compiler }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Publish release (tag only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          generate_release_notes: true
