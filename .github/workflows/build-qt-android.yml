name: build-qt-android

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: "Qt 源码版本（默认 6.12.0）"
        required: false
        default: "6.12.0"
      openssl_version:
        description: "OpenSSL 源码版本（只解出 include/openssl 供 runtime SSL 用，默认 3.5.4，对齐 Qt 6.12 Tools and Versions）"
        required: false
        default: "3.5.4"
      skip_modules:
        description: "要跳过/关闭的模块与特性（空格或逗号分隔）：模块名走 -skip，以 - 开头的原样传给 configure（如 -no-feature-printsupport）。默认 qtwebengine + 10 个模块 + 3 个 feature（含关闭 tiff，保留 png/jpeg/webp/svg/ico/gif）"
        required: false
        default: "qtwebengine qtgrpc qtserialbus qtscxml qtopcua qtremoteobjects qtactiveqt qtwayland qttasktree qtcoap qtwebchannel -no-feature-printsupport -no-feature-spatialaudio -no-feature-tiff"
      host_modules:
        description: "host 阶段编译的模块：auto=只编 target 构建要用的工具模块；all=全量（只减去 skip_modules）；或逗号分隔自定义"
        required: false
        default: "auto"
      abi:
        description: "目标 ABI（官方 CI 对照行用 armeabi-v7a）"
        required: false
        type: choice
        default: "arm64-v8a"
        options:
          - arm64-v8a
          - armeabi-v7a
      host_only:
        description: "仅构建 host 工具（调试用）"
        required: false
        type: boolean
        default: false
      host_linkage:
        description: "host 的链接方式：shared=共享（默认，工具运行期依赖 Qt6*.dll）；static=静态（去 DLL 依赖，未经 CI 验证）"
        required: false
        type: choice
        default: shared
        options:
          - shared
          - static
      host_tools:
        description: "host 工具裁剪：android=只留 Android 构建链路所需（默认）；full=保留全部，用于排查“是不是裁太狠”"
        required: false
        type: choice
        default: android
        options:
          - android
          - full
      runner:
        description: "Runner 标签"
        required: false
        default: "windows-2022"
  push:
    tags:
      - "qt-*"

permissions:
  contents: write

concurrency:
  group: build-qt-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 360
    env:
      QT_VERSION: ${{ inputs.qt_version || '6.12.0' }}
      OPENSSL_VERSION: ${{ inputs.openssl_version || '3.5.4' }}
      QT_SKIP_MODULES: ${{ inputs.skip_modules || 'qtwebengine qtgrpc qtserialbus qtscxml qtopcua qtremoteobjects qtactiveqt qtwayland qttasktree qtcoap qtwebchannel -no-feature-printsupport -no-feature-spatialaudio -no-feature-tiff' }}
      HOST_MODULES: ${{ inputs.host_modules || 'auto' }}
      # auto 白名单：qtbase/qtsvg/qtdeclarative/qtshadertools/qttools/qtscxml/qtremoteobjects/qtgrpc/
      # qtquick3d/qtquick3dphysics/qtquicktimeline/qtopcua/qtlottie/qtcanvaspainter(6.12 起)
      HOST_AUTO_MODULES: 'qtbase qtsvg qtdeclarative qtshadertools qttools qtscxml qtremoteobjects qtgrpc qtquick3d qtquick3dphysics qtquicktimeline qtopcua qtlottie qtcanvaspainter'
      HOST_ONLY: ${{ inputs.host_only || 'false' }}
      HOST_LINKAGE: ${{ inputs.host_linkage || 'shared' }}
      HOST_TOOLS: ${{ inputs.host_tools || 'android' }}
      QT_ABI: ${{ inputs.abi || 'arm64-v8a' }}
      WORK_ROOT: D:\qt
      SRC_ROOT: D:\qt\src
      ARCHIVE_DIR: D:\qt\archives
      HOST_PREFIX: D:\qt\host
      HOST_BUILD_DIR: D:\qt\host-build
      TARGET_BUILD_DIR: D:\qt\target-build
      TARGET_PREFIX: D:\qt\android_${{ inputs.abi || 'arm64-v8a' }}
      TOOLS_DIR: C:\tools
      ANDROID_SDK_ROOT: C:\android\sdk
      ANDROID_NDK_ROOT: C:\android\ndk\android-ndk-r27c
      NDK_VERSION: r27c
      SDK_PLATFORM: android-37.0
      SDK_BUILD_TOOLS: 37.0.0
      CMDLINE_TOOLS_VERSION: "19.0"
      CMAKE_VERSION: 4.3.2
      MINGW_VERSION: 15.1.0
      NINJA_VERSION: 1.10.2
      PERL_VERSION: 5.42.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disk space (before)
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}} |
            Format-Table
          # 删除镜像自带的 Android SDK，本流程使用固定版本的独立安装
          Remove-Item 'C:\Android' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Defender exclusions
        shell: pwsh
        run: |
          # 先解压数万个小文件时，实时扫描是主要耗时；runner 以管理员运行，排除失败不致命
          try {
            foreach ($p in @('D:\qt', 'C:\tools', 'C:\android', $env:GITHUB_WORKSPACE)) {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
            }
            Write-Output "Defender 已排除: D:\qt, C:\tools, C:\android, $env:GITHUB_WORKSPACE"
          } catch {
            Write-Warning "设置 Defender 排除失败，继续执行: $($_.Exception.Message)"
          }

      - name: Compute cache key suffix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:QT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "qt_version 必须是 x.y.z：$($env:QT_VERSION)" }
          $key = ($env:QT_SKIP_MODULES -replace '[, ]+', '-').ToLowerInvariant()
          if (-not $key) { $key = 'none' }
          "SKIP_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # host 前缀缓存必须区分 host 模块集，否则旧缓存会掩盖最小集的配置错误；
          # auto 的实际集合随白名单变化，用白名单散列，避免改了白名单仍命中旧前缀
          $hostSet = if ($env:HOST_MODULES -eq 'auto') { $env:HOST_AUTO_MODULES } else { $env:HOST_MODULES }
          $hostKey = ($hostSet -replace '[^A-Za-z0-9]+', '-').Trim('-').ToLowerInvariant()
          if ($env:HOST_MODULES -eq 'auto') {
            $sha = [Security.Cryptography.SHA256]::Create()
            $h = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($hostSet))).Replace('-', '')
            $hostKey = 'auto-' + $h.Substring(0, 8).ToLowerInvariant()
          }
          if (-not $hostKey) { $hostKey = 'none' }
          "HOST_SET_KEY=$hostKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache Android SDK / NDK
        uses: actions/cache@v6
        with:
          path: C:\android
          key: android-${{ env.NDK_VERSION }}-${{ env.SDK_PLATFORM }}-${{ env.SDK_BUILD_TOOLS }}-${{ env.CMDLINE_TOOLS_VERSION }}-v1

      - name: Cache Qt source archive
        uses: actions/cache@v6
        with:
          path: D:\qt\archives
          key: qt-src-zip-${{ env.QT_VERSION }}-v1

      # runtime SSL 只需要头文件，按 OpenSSL 版本缓存，跳过下载与解压
      - name: Cache OpenSSL headers
        if: env.HOST_ONLY != 'true'
        uses: actions/cache@v6
        with:
          path: D:\qt\openssl-headers
          key: openssl-headers-${{ env.OPENSSL_VERSION }}-${{ hashFiles('.github/workflows/build-qt-android.yml') }}

      - name: Setup JDK 21.0.9
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.9"
          architecture: x64

      - name: Setup Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          architecture: x64

      - name: Install build tools (CMake 4.3.2 / Ninja 1.10.2 / Strawberry Perl)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-File([string]$Url, [string]$Out) {
            curl.exe -L --fail --retry 5 --retry-delay 10 --max-time 1800 -o $Out $Url
            if ($LASTEXITCODE -ne 0) { throw "下载失败: $Url" }
          }
          New-Item -ItemType Directory -Force -Path $env:TOOLS_DIR | Out-Null

          # 7-Zip 24.09（仅用于打包/解压）
          Get-File 'https://www.7-zip.org/a/7z2409-x64.exe' "$env:TOOLS_DIR\7z-installer.exe"
          Start-Process -Wait -FilePath "$env:TOOLS_DIR\7z-installer.exe" -ArgumentList '/S', "/D=$env:TOOLS_DIR\7zip"
          "SEVEN_ZIP=$env:TOOLS_DIR\7zip\7z.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # MinGW 只在 host 构建步骤里下载使用；target 用 NDK clang

          # CMake 4.3.2
          Get-File 'https://github.com/Kitware/CMake/releases/download/v4.3.2/cmake-4.3.2-windows-x86_64.zip' "$env:TOOLS_DIR\cmake.zip"
          Expand-Archive "$env:TOOLS_DIR\cmake.zip" "$env:TOOLS_DIR\cmake-tmp" -Force
          Move-Item "$env:TOOLS_DIR\cmake-tmp\cmake-4.3.2-windows-x86_64" "$env:TOOLS_DIR\cmake" -Force

          # Ninja 1.10.2
          Get-File 'https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip' "$env:TOOLS_DIR\ninja.zip"
          Expand-Archive "$env:TOOLS_DIR\ninja.zip" "$env:TOOLS_DIR\ninja" -Force

          # Strawberry Perl 便携版（Qt 构建脚本依赖 perl；官方页未列该版本）
          Get-File 'https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54221_64bit/strawberry-perl-5.42.2.1-64bit-portable.zip' "$env:TOOLS_DIR\perl.zip"
          Expand-Archive "$env:TOOLS_DIR\perl.zip" "$env:TOOLS_DIR\strawberry" -Force

          @(
            "$env:TOOLS_DIR\cmake\bin",
            "$env:TOOLS_DIR\ninja",
            "$env:TOOLS_DIR\strawberry\c\bin",
            "$env:TOOLS_DIR\strawberry\perl\bin"
          ) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          & cmake --version
          & ninja --version
          & perl --version

      # runtime SSL 只需要头文件；源码包 include/openssl 里只有 .h.in，实体 .h 必须由 Configure + util/dofile.pl 生成（不编译、不产库）
      - name: Prepare OpenSSL headers (headers only)
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $started = Get-Date
          $root = "$env:WORK_ROOT\openssl-headers"
          $includeDir = "$root\include\openssl"
          "OPENSSL_HEADERS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (Test-Path (Join-Path $includeDir 'ssl.h')) {
            $count = (Get-ChildItem $includeDir -Filter *.h -File).Count
            Write-Output "OpenSSL headers: cache hit ($env:OPENSSL_VERSION, $count headers) -> $includeDir"
            "T_OPENSSL_HEADERS=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            # 缓存命中时没有跑 Configure，BUILD-INFO 需要如实记录
            "OPENSSL_CONFIGURE_TARGET=cached" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            return
          }
          $tmp = "$env:WORK_ROOT\openssl-tmp"
          $tarball = "$env:WORK_ROOT\openssl-$env:OPENSSL_VERSION.tar.gz"
          Remove-Item $tmp, $tarball, "$tarball.sha256" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()

          # 1) 下载：3.5.x 起官方发布页把源码包托管在 GitHub release（openssl.org/source 只做 301）
          $base = "https://github.com/openssl/openssl/releases/download/openssl-$env:OPENSSL_VERSION/openssl-$env:OPENSSL_VERSION"
          function Get-File([string]$Url, [string]$Out) {
            curl.exe -L --fail --retry 5 --retry-delay 10 --max-time 1800 -o $Out $Url
            if ($LASTEXITCODE -ne 0) { throw "download failed: $Url" }
          }
          Get-File "$base.tar.gz" $tarball
          # 拿不到 .sha256 只告警；拿到但校验不符必须中止
          $expected = $null
          try {
            Get-File "$base.tar.gz.sha256" "$tarball.sha256"
            $expected = ((Get-Content "$tarball.sha256" -Raw) -split '\s+')[0].ToLowerInvariant()
          } catch {
            Write-Warning "OpenSSL source checksum NOT verified: $($_.Exception.Message)"
          }
          if ($expected) {
            $actual = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "SHA256 mismatch: expected=$expected actual=$actual" }
            Write-Output "SHA256 verified: $actual"
          }
          $downloadSec = [int]$sw.Elapsed.TotalSeconds

          # 2) 解压（7z 两次：tar.gz -> tar -> tree）
          $sw.Restart()
          & $env:SEVEN_ZIP x -y "-o$tmp" $tarball | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed to unpack $tarball" }
          $tarPath = Join-Path $tmp "openssl-$env:OPENSSL_VERSION.tar"
          if (Test-Path $tarPath) {
            & $env:SEVEN_ZIP x -y "-o$tmp\tree" $tarPath | Out-Null
            $srcDir = "$tmp\tree\openssl-$env:OPENSSL_VERSION"
          } else {
            $srcDir = "$tmp\openssl-$env:OPENSSL_VERSION"
          }
          if (-not (Test-Path (Join-Path $srcDir 'Configure')) -or -not (Test-Path (Join-Path $srcDir 'include\openssl\ssl.h.in'))) {
            throw "unexpected OpenSSL source layout: $srcDir"
          }
          $extractSec = [int]$sw.Elapsed.TotalSeconds

          # 3) Perl 模块预检：Configure 与 dofile.pl 的 use 语句逐个核对，缺一个就先失败
          $sw.Restart()
          $perlLibs = @("-I$(Join-Path $srcDir 'util\perl')", "-I$(Join-Path $srcDir 'external\perl\Text-Template-1.56\lib')")
          $mods = @('Config', 'File::Basename', 'File::Spec::Functions', 'File::Path', 'Cwd', 'FindBin',
                    'Getopt::Std', 'Text::Template', 'OpenSSL::Template', 'OpenSSL::config')
          foreach ($m in $mods) {
            $probe = (& perl @perlLibs "-M$m" -e "exit 0" 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "Perl module '$m' missing, OpenSSL Configure cannot run.`n$probe`nFix the Perl setup or change the header source; this check must not be skipped."
            }
          }
          Write-Output "Perl precheck OK ($($mods.Count) modules): $($mods -join ', ')"
          $precheckSec = [int]$sw.Elapsed.TotalSeconds

          # 4) Configure：Strawberry Perl 是 MSWin32 构建，会给所有 unix build_scheme 的目标（linux-*、mingw64）
          #    套 Configurations/unix-checker.pm 并直接拒绝；只有 VC 目标走 windows-checker.pm。
          #    只为产出 configdata.pm 生成头文件、不编译，所以 VC-WIN64A 加 no-asm 免除 nasm 依赖
          $sw.Restart()
          $cfgLog = "$env:WORK_ROOT\openssl-configure.log"
          $cfgTarget = $null
          $cfgOut = ''
          $attempts = @(
            [pscustomobject]@{ Name = 'mingw64';           Args = @('mingw64', 'no-shared', 'no-tests') },
            [pscustomobject]@{ Name = 'VC-WIN64A+no-asm';  Args = @('VC-WIN64A', 'no-shared', 'no-tests', 'no-asm') }
          )
          foreach ($a in $attempts) {
            Push-Location $srcDir
            try {
              $out = (& perl Configure @($a.Args) 2>&1 | Out-String)
              $code = $LASTEXITCODE
            } finally {
              Pop-Location
            }
            $cfgOut = "$cfgOut`n== target $($a.Name) (exit=$code) ==`n$out"
            if ($code -eq 0 -and (Test-Path (Join-Path $srcDir 'configdata.pm'))) {
              $cfgTarget = $a.Name
              break
            }
            Write-Warning "OpenSSL Configure failed for target $($a.Name) (exit=$code), trying next target"
          }
          Set-Content -Path $cfgLog -Value $cfgOut -Encoding utf8
          if (-not $cfgTarget) {
            $tail = ($cfgOut.Trim() -split "`r?`n" | Select-Object -Last 20) -join "`n"
            throw "OpenSSL Configure failed for all targets (mingw64, VC-WIN64A+no-asm).`n$tail`nFull log: $cfgLog"
          }
          Write-Output "OpenSSL Configure target: $cfgTarget"
          "OPENSSL_CONFIGURE_TARGET=$cfgTarget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $configureSec = [int]$sw.Elapsed.TotalSeconds

          # 5) 生成：.h.in -> .h（纯 Perl 模板替换，不编译）；dofile 只依赖 configdata.pm，-o 仅用于告警文案
          $sw.Restart()
          $templates = @(Get-ChildItem (Join-Path $srcDir 'include\openssl') -Filter *.h.in -File)
          if ($templates.Count -lt 20) { throw "unexpected .h.in template count: $($templates.Count)" }
          $rel = @($templates | ForEach-Object { "include/openssl/$($_.Name)" })
          Push-Location $srcDir
          try {
            $genOut = (& perl -I. -Mconfigdata util/dofile.pl -oConfigure -i .in @rel 2>&1 | Out-String)
            $genCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($genCode -ne 0) { throw "OpenSSL header generation failed (util/dofile.pl).`n$($genOut.Trim())" }
          $generateSec = [int]$sw.Elapsed.TotalSeconds

          # 6) 校验：每个 .h.in 都要有 .h，关键头文件与版本宏齐全
          $sw.Restart()
          foreach ($t in $templates) {
            $h = Join-Path $srcDir "include\openssl\$($t.BaseName)"
            if (-not (Test-Path $h)) { throw "missing generated header: include/openssl/$($t.BaseName)" }
          }
          foreach ($h in @('ssl.h', 'opensslv.h', 'x509v3.h')) {
            if (-not (Test-Path (Join-Path $srcDir "include\openssl\$h"))) { throw "missing key header: include/openssl/$h" }
          }
          $verH = Join-Path $srcDir 'include\openssl\opensslv.h'
          if (-not (Select-String -Path $verH -Pattern '^#\s*define\s+OPENSSL_VERSION_MAJOR\s+3')) {
            throw "OPENSSL_VERSION_MAJOR is not 3 in generated opensslv.h (runtime suffix would not match libssl_3.so)"
          }
          foreach ($macro in @('OPENSSL_VERSION_NUMBER', 'OPENSSL_VERSION_PREREQ')) {
            if (-not (Select-String -Path $verH -Pattern $macro)) { throw "$macro missing in generated opensslv.h" }
          }
          $genCount = (Get-ChildItem (Join-Path $srcDir 'include\openssl') -Filter *.h -File).Count
          $staticCount = $genCount - $templates.Count
          Write-Output "OpenSSL headers: $($templates.Count) generated + $staticCount static = $genCount .h"
          if ($staticCount -lt 100 -or $genCount -lt 130) { throw "unexpected header count: static=$staticCount total=$genCount" }

          # 只保留 include/openssl（去掉未生成的模板），源码树、tar 包与临时目录立即删除
          Remove-Item "$root\include\openssl" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$root\include" | Out-Null
          Move-Item (Join-Path $srcDir 'include\openssl') (Join-Path "$root\include" 'openssl') -Force
          Get-ChildItem $includeDir -Filter *.h.in -File | Remove-Item -Force
          Remove-Item $tmp, $tarball, "$tarball.sha256" -Recurse -Force -ErrorAction SilentlyContinue
          $count = (Get-ChildItem $includeDir -Filter *.h -File).Count
          if ($count -lt 130) { throw "unexpected header count in $includeDir : $count" }
          $verifySec = [int]$sw.Elapsed.TotalSeconds

          Write-Output ("OpenSSL headers timing (s): download=$downloadSec extract=$extractSec precheck=$precheckSec " +
            "configure=$configureSec generate=$generateSec verify=$verifySec")
          Write-Output "OpenSSL headers: $env:OPENSSL_VERSION ($count headers) -> $includeDir"
          "T_OPENSSL_HEADERS=$([int]((Get-Date) - $started).TotalSeconds)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Android SDK 19.0 / platform 37.0 / build-tools 37.0.0 / NDK r27c
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-File([string]$Url, [string]$Out) {
            curl.exe -L --fail --retry 5 --retry-delay 10 --max-time 1800 -o $Out $Url
            if ($LASTEXITCODE -ne 0) { throw "下载失败: $Url" }
          }
          New-Item -ItemType Directory -Force -Path $env:ANDROID_SDK_ROOT | Out-Null

          $sdkmanager = "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path "$env:ANDROID_SDK_ROOT\platforms\$env:SDK_PLATFORM")) {
            $clt = "$env:TOOLS_DIR\cmdline-tools.zip"
            Get-File 'https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip' $clt
            Expand-Archive $clt "$env:TOOLS_DIR\clt" -Force
            New-Item -ItemType Directory -Force -Path "$env:ANDROID_SDK_ROOT\cmdline-tools" | Out-Null
            Move-Item "$env:TOOLS_DIR\clt\cmdline-tools" "$env:ANDROID_SDK_ROOT\cmdline-tools\latest" -Force

            (1..60 | ForEach-Object { 'y' }) | & $sdkmanager --licenses
            & $sdkmanager "--sdk_root=$env:ANDROID_SDK_ROOT" "platforms;$env:SDK_PLATFORM" "build-tools;$env:SDK_BUILD_TOOLS" "platform-tools"
            if ($LASTEXITCODE -ne 0) { throw 'sdkmanager 安装失败' }
          }

          if (-not (Test-Path "$env:ANDROID_NDK_ROOT\source.properties")) {
            $ndkZip = "$env:TOOLS_DIR\ndk.zip"
            Get-File 'https://dl.google.com/android/repository/android-ndk-r27c-windows.zip' $ndkZip
            New-Item -ItemType Directory -Force -Path 'C:\android\ndk' | Out-Null
            & $env:SEVEN_ZIP x -y "-oC:\android\ndk" $ndkZip
            if ($LASTEXITCODE -ne 0) { throw 'NDK 解压失败' }
          }

          & "$env:ANDROID_NDK_ROOT\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe" --version
          Select-String -Path "$env:ANDROID_NDK_ROOT\source.properties" -Pattern 'Pkg.Revision'

      - name: Fetch Qt sources
        shell: pwsh
        run: |
          # 只保留 zip 源码归档，其他旧归档（如命中旧缓存）占 D: 空间，直接清掉
          if (Test-Path $env:ARCHIVE_DIR) {
            Get-ChildItem $env:ARCHIVE_DIR -File | Where-Object { $_.Extension -ne '.zip' } |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & "$env:GITHUB_WORKSPACE\scripts\fetch-qt-source.ps1" `
            -Version $env:QT_VERSION `
            -ArchiveDir $env:ARCHIVE_DIR `
            -SrcRoot $env:SRC_ROOT
          $sw.Stop()
          "T_FETCH={0:N1}" -f $sw.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Disk space (before build)
        shell: pwsh
        run: |
          Get-PSDrive D, C |
            Select-Object Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}} |
            Format-Table

      - name: Cache host Qt prefix
        uses: actions/cache@v6
        with:
          path: D:\qt\host
          key: qt-host-build-${{ env.QT_VERSION }}-${{ env.SKIP_KEY }}-${{ env.HOST_LINKAGE }}-hostset${{ env.HOST_SET_KEY }}-mingw${{ env.MINGW_VERSION }}-cmake${{ env.CMAKE_VERSION }}-v1

      - name: Build host Qt tools (source)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:SRC_ROOT "qt-everywhere-src-$env:QT_VERSION"
          # -no-feature-* 之类的原始参数只交给 target configure，不参与模块集合计算
          $targetSkips = @($env:QT_SKIP_MODULES -split '[\s,]+' | Where-Object { $_ -and -not $_.StartsWith('-') })
          $allModules = @(Get-ChildItem $src -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'CMakeLists.txt') } | ForEach-Object Name)
          if ($env:HOST_MODULES -eq 'all') {
            $keep = @($allModules | Where-Object { $_ -notin $targetSkips })
          } else {
            # auto = 白名单 ∩ target 实际构建的模块：target 跳过的模块不会调用其工具
            $keep = if ($env:HOST_MODULES -eq 'auto') {
              @($env:HOST_AUTO_MODULES -split '[\s,]+' | Where-Object { $_ }) |
                Where-Object { $_ -in $allModules -and $_ -notin $targetSkips }
            } else {
              @($env:HOST_MODULES -split '[\s,]+' | Where-Object { $_ })
            }
            $unknown = @($keep | Where-Object { $_ -notin $allModules })
            if ($unknown.Count -gt 0) { throw "host_modules 含未知模块：$($unknown -join ', ')" }
            if ($keep -notcontains 'qtbase') { throw 'host_modules 必须包含 qtbase' }
          }
          $hostSkips = @($allModules | Where-Object { $_ -notin $keep })
          # BUILD-INFO.txt 需要生效集合，缓存命中时也要有
          "HOST_KEEP_MODULES={0}" -f (($keep | Sort-Object) -join ',') | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output ("host 编译模块（{0}）：{1}" -f $env:HOST_MODULES, (($keep | Sort-Object) -join ', '))
          Write-Output ("host 跳过模块：{0}" -f (($hostSkips | Sort-Object) -join ', '))

          $markerId = "build:$env:HOST_LINKAGE`:$env:HOST_SET_KEY"
          $marker = Join-Path $env:HOST_PREFIX '.cache-ok'
          if ((Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq $markerId)) {
            Write-Output 'host 前缀命中 build 缓存，跳过 host 构建'
            exit 0
          }

          # host 构建需要 MinGW 编译器
          function Get-File([string]$Url, [string]$Out) {
            curl.exe -L --fail --retry 5 --retry-delay 10 --max-time 1800 --noproxy '*' -o $Out $Url
            if ($LASTEXITCODE -ne 0) { throw "下载失败: $Url" }
          }
          Get-File 'https://github.com/niXman/mingw-builds-binaries/releases/download/15.1.0-rt_v12-rev0/x86_64-15.1.0-release-posix-seh-msvcrt-rt_v12-rev0.7z' "$env:TOOLS_DIR\mingw.7z"
          & $env:SEVEN_ZIP x -y "-o$env:TOOLS_DIR" "$env:TOOLS_DIR\mingw.7z"
          if ($LASTEXITCODE -ne 0) { throw 'MinGW 解压失败' }
          $env:PATH = "$env:TOOLS_DIR\mingw64\bin;$env:PATH"
          & gcc --version

          New-Item -ItemType Directory -Force -Path $env:HOST_PREFIX | Out-Null
          Remove-Item $env:HOST_BUILD_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:HOST_BUILD_DIR | Out-Null
          Push-Location $env:HOST_BUILD_DIR
          $t = [Diagnostics.Stopwatch]::StartNew()
          try {
            $skipArgs = @()
            foreach ($m in $hostSkips) { $skipArgs += @('-skip', $m) }
            # static 只用于验证自包含/去 DLL 依赖：Qt 文档建议 target 为 shared 时 host 不要 static，且 MinGW 静态不在官方 CI
            $linkArgs = if ($env:HOST_LINKAGE -eq 'static') { @('-static', '-static-runtime', '-DFEATURE_relocatable=ON') } else { @() }
            $cfgArgs = @('-prefix', $env:HOST_PREFIX, '-release', '-opensource', '-confirm-license',
              '-nomake', 'examples', '-nomake', 'tests', '-no-openssl', '-platform', 'win32-g++',
              '-qt-zlib', '-qt-libpng', '-qt-libjpeg', '-qt-freetype', '-qt-harfbuzz', '-schannel',
              '-no-feature-sql-psql', '-no-feature-sql-mysql', '-no-feature-sql-odbc', '-no-feature-sql-oci',
              '-no-feature-sql-db2', '-no-feature-sql-ibase', '-no-feature-sql-mimer', '-no-feature-cups') + $linkArgs + $skipArgs
            $cfgLine = '"' + "$src\configure.bat" + '" ' + (($cfgArgs | ForEach-Object { if ($_ -match '\s') { "'$_'" } else { $_ } }) -join ' ')
            Set-Content -Path "$env:WORK_ROOT\host-configure.txt" -Value $cfgLine -Encoding utf8
            & "$src\configure.bat" @cfgArgs
            if ($LASTEXITCODE -ne 0) { throw "host configure 失败: $LASTEXITCODE" }
            $t.Stop(); "T_HOST_CONFIGURE={0:N1}" -f $t.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $t.Restart()
            & cmake --build . --parallel $env:NUMBER_OF_PROCESSORS
            if ($LASTEXITCODE -ne 0) { throw "host build 失败: $LASTEXITCODE" }
            $t.Stop(); "T_HOST_BUILD={0:N1}" -f $t.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $t.Restart()
            # 剥符号：host bin 约 1.96 GB 中约 0.79 GB 是 COFF 符号，剥掉不影响这些工具运行
            & cmake --install . --strip
            if ($LASTEXITCODE -ne 0) { throw "host install 失败: $LASTEXITCODE" }
            $t.Stop(); "T_HOST_INSTALL={0:N1}" -f $t.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            Pop-Location
          }
          Set-Content -Path $marker -Value $markerId -Encoding utf8
          Remove-Item $env:HOST_BUILD_DIR -Recurse -Force -ErrorAction SilentlyContinue

      - name: Cache Gradle home
        if: env.HOST_ONLY != 'true'
        uses: actions/cache@v6
        with:
          # Qt 构建期 Gradle 的缓存（wrapper 分发包 + Maven 依赖）
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-qt${{ env.QT_VERSION }}-bt${{ env.SDK_BUILD_TOOLS }}-v1
          restore-keys: |
            gradle-qt${{ env.QT_VERSION }}-bt${{ env.SDK_BUILD_TOOLS }}-

      - name: Prepare Gradle offline cache
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Qt 6.12 的 Android JAR 由 Gradle 构建，target configure 会做离线缓存校验，
          # 未命中直接 FATAL_ERROR（qtbase/cmake/QtJavaHelpers.cmake:278-289）
          $src = Join-Path $env:SRC_ROOT "qt-everywhere-src-$env:QT_VERSION"
          $qtbase = Join-Path $src 'qtbase'
          $jarProject = Join-Path $qtbase 'src\android\jar'
          $setupScript = Join-Path $qtbase 'cmake\QtSetupAndroid.cmake'
          $gradlew = Join-Path $qtbase 'src\3rdparty\gradle\gradlew.bat'
          $wrapperJar = Join-Path $qtbase 'src\3rdparty\gradle\gradle\wrapper\gradle-wrapper.jar'
          foreach ($p in @($jarProject, $setupScript, $gradlew, $wrapperJar)) {
            if (-not (Test-Path $p)) { throw "Gradle 前置文件缺失: $p" }
          }

          # 参数与 QtJavaHelpers.cmake:253-263 传给校验脚本的保持一致（含 build variant/build-tools）
          $common = @(
            '-DACTION_RESOLVE_GRADLE=ON',
            "-DQT_ROOT_DIR=$qtbase",
            "-DGRADLE_PROJECT_DIR=$jarProject",
            '-DGRADLE_BUILD_VARIANT=Release',
            "-DQT_ANDROID_SDK_BUILD_TOOLS_REVISION=$env:SDK_BUILD_TOOLS"
          )
          $sw = [Diagnostics.Stopwatch]::StartNew()

          # 1) 先按 Qt 的离线口径校验，命中则无需联网
          & cmake -E env "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" cmake @common `
            '-DONLY_VERIFY_GRADLE_CACHE=ON' -P "$setupScript" 2>&1 | Tee-Object -Variable verifyOut
          if ($LASTEXITCODE -eq 0) {
            Write-Output '--- Gradle 离线缓存已命中，跳过联网解析 ---'
          } else {
            # 2) 未命中：按 Qt 报错里给出的命令联网填充缓存（wrapper 会自行下载 Gradle 分发包）
            Write-Output '--- Gradle 离线缓存未命中，开始联网解析依赖 ---'
            & cmake -E env "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" cmake @common -P "$setupScript" 2>&1 |
              Tee-Object -Variable resolveOut
            if ($LASTEXITCODE -ne 0) {
              Write-Output '--- Gradle 解析失败诊断 ---'
              Get-Content (Join-Path $qtbase 'src\3rdparty\gradle\gradle\wrapper\gradle-wrapper.properties')
              & cmd /c "$gradlew" --version 2>&1 | Select-Object -Last 20
              $gh = Join-Path $env:USERPROFILE '.gradle'
              if (Test-Path $gh) {
                Get-ChildItem $gh -Recurse -File -ErrorAction SilentlyContinue |
                  Measure-Object Length -Sum |
                  Select-Object Count, @{n = 'MB'; e = { [math]::Round($_.Sum / 1MB, 1) } }
              }
              throw 'Gradle 离线缓存填充失败，见上方 Gradle 输出'
            }
          }

          $gh = Join-Path $env:USERPROFILE '.gradle'
          if (Test-Path $gh) {
            $sum = (Get-ChildItem $gh -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            "Gradle 缓存体积: {0:N1} MB ({1})" -f ($sum / 1MB), $gh
            Get-ChildItem (Join-Path $gh 'wrapper\dists') -Directory -ErrorAction SilentlyContinue | Select-Object Name
          }
          $sw.Stop()
          "T_GRADLE_PREP={0:N1}" -f $sw.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Android target
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:SRC_ROOT "qt-everywhere-src-$env:QT_VERSION"
          Write-Output '--- 磁盘(target 前) ---'
          Get-PSDrive D, C | Select-Object Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}} | Format-Table
          Remove-Item $env:TARGET_BUILD_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:TARGET_BUILD_DIR | Out-Null
          Push-Location $env:TARGET_BUILD_DIR
          $t = [Diagnostics.Stopwatch]::StartNew()
          try {
            $skipArgs = @()
            foreach ($m in ($env:QT_SKIP_MODULES -split '[\s,]+' | Where-Object { $_ })) {
              # 以 - 开头的是 configure 原始参数（如 -no-feature-printsupport），其余按 -skip 模块处理
              if ($m.StartsWith('-')) { $skipArgs += $m } else { $skipArgs += @('-skip', $m) }
            }
            # SSL 只编入 runtime 能力，不链接 OpenSSL：头文件仅用于配置期探测与 backend 插件编译
            # Qt 的 configure 只把 NAME=VALUE 形式的变量赋值转发给 CMake（QtProcessConfigureArgs.cmake:1096-1100、1474-1476），
            # -D 前缀不被识别；路径统一用正斜杠，避免反斜杠在 CMake 根路径比较里失效
            if (-not $env:OPENSSL_HEADERS_ROOT) { throw 'OPENSSL_HEADERS_ROOT 未设置，target 侧找不到 OpenSSL 头文件' }
            $osslRoot = $env:OPENSSL_HEADERS_ROOT -replace '\\', '/'
            $cfgArgs = @('-prefix', $env:TARGET_PREFIX, '-release', '-opensource', '-confirm-license',
              '-nomake', 'examples', '-nomake', 'tests',
              '-openssl-runtime',
              "OPENSSL_ROOT_DIR=$osslRoot", "OPENSSL_INCLUDE_DIR=$osslRoot/include",
              '-qt-host-path', $env:HOST_PREFIX,
              '-android-abis', $env:QT_ABI,
              '-android-sdk', $env:ANDROID_SDK_ROOT,
              '-android-ndk', $env:ANDROID_NDK_ROOT,
              '-android-javac-source', '17', '-android-javac-target', '17',
              '-no-feature-sql-psql', '-no-feature-sql-mysql', '-no-feature-sql-odbc', '-no-feature-sql-oci',
              '-no-feature-sql-db2', '-no-feature-sql-ibase', '-no-feature-sql-mimer',
              '-no-feature-cups', '-no-feature-pkg-config') + $skipArgs
            $cfgLine = '"' + "$src\configure.bat" + '" ' + (($cfgArgs | ForEach-Object { if ($_ -match '\s') { "'$_'" } else { $_ } }) -join ' ')
            Set-Content -Path "$env:WORK_ROOT\target-configure.txt" -Value $cfgLine -Encoding utf8
            & "$src\configure.bat" @cfgArgs
            if ($LASTEXITCODE -ne 0) { throw "target configure 失败: $LASTEXITCODE" }
            $t.Stop(); "T_TARGET_CONFIGURE={0:N1}" -f $t.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Output '--- 磁盘(target configure 后) ---'
            Get-PSDrive D, C | Select-Object Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}} | Format-Table
            $t.Restart()
            & cmake --build . --parallel $env:NUMBER_OF_PROCESSORS
            if ($LASTEXITCODE -ne 0) { throw "target build 失败: $LASTEXITCODE" }
            $t.Stop(); "T_TARGET_BUILD={0:N1}" -f $t.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Output '--- 磁盘(target build 后) ---'
            Get-PSDrive D, C | Select-Object Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}} | Format-Table
            $t.Restart()
            # 剥符号：target .so 约 253 MB 中约 112 MB 是 .symtab/.strtab，运行时只用 .dynsym
            & cmake --install . --strip
            if ($LASTEXITCODE -ne 0) { throw "target install 失败: $LASTEXITCODE" }
            $t.Stop(); "T_TARGET_INSTALL={0:N1}" -f $t.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            Pop-Location
          }
          Remove-Item $env:TARGET_BUILD_DIR -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output '--- 磁盘(target 后) ---'
          Get-PSDrive D, C | Select-Object Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}} | Format-Table

      - name: Verify target prefix
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        env:
          # Windows runner 的默认 cp1252 会让中文输出抛 UnicodeEncodeError
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          & python "$env:GITHUB_WORKSPACE\scripts\verify-android-prefix.py" `
            --prefix "$env:TARGET_PREFIX" `
            --host-prefix "$env:HOST_PREFIX" `
            --abi "$env:QT_ABI" `
            --sdk "$env:ANDROID_SDK_ROOT" `
            --ndk "$env:ANDROID_NDK_ROOT" `
            --qt-version "$env:QT_VERSION" `
            --out "$env:WORK_ROOT\manifest.json"

      - name: Prune host prefix (artifact slimming)
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 产物只用于编 Android 程序：host 前缀按白名单保留，桌面开发/文档/美术工具整块裁掉
          # mkspecs 本次保留：target_qt.conf 里 HostSpec=win32-g++，删了 target 前缀的 qmake 会报找不到 spec
          $tools = $env:HOST_TOOLS
          if (-not $tools) { $tools = 'android' }
          $beforeCount = (Get-ChildItem $env:HOST_PREFIX -Recurse -File -Force | Measure-Object).Count
          $beforeSize = (Get-ChildItem $env:HOST_PREFIX -Recurse -File -Force | Measure-Object Length -Sum).Sum
          if (-not $beforeSize) { $beforeSize = 0 }
          $removed = @()
          function Remove-Tree([string]$path) {
            if (-not (Test-Path $path)) { return }
            $n = (Get-ChildItem $path -Recurse -File -Force | Measure-Object).Count
            $s = (Get-ChildItem $path -Recurse -File -Force | Measure-Object Length -Sum).Sum
            if (-not $s) { $s = 0 }
            $script:removed += ,(@{ Name = $path.Substring($env:HOST_PREFIX.Length + 1); Count = $n; Bytes = [double]$s })
            Remove-Item $path -Recurse -Force
          }

          # 1) 目录白名单：bin / lib / mkspecs / metatypes；plugins/qml/share/phrasebooks/modules/include/doc/sbom 全删
          #    host/metatypes 是顶层目录（实测 9.0 MiB JSON），非 lib/metatypes；保留仅为兜底：
          #    host 自身的 Qt6CoreTargets.cmake 用 ${_IMPORT_PREFIX}/./metatypes 引用它，Android 交叉编译链路不读
          foreach ($d in @(Get-ChildItem $env:HOST_PREFIX -Directory -Force)) {
            if (@('bin', 'lib', 'mkspecs', 'metatypes') -notcontains $d.Name) { Remove-Tree $d.FullName }
          }
          # .cache-ok 必须留在前缀里：actions/cache 在 job 末尾保存，删了它下一轮就无法校验缓存命中
          # （会白跑一遍 host 编译）；打包时用 7z 的 -x! 排除，产物里不会出现

          # 2) lib 白名单：只留 cmake 子目录（实测 lib 下仅有 cmake / objects-Release 两个目录）
          foreach ($d in @(Get-ChildItem "$env:HOST_PREFIX\lib" -Directory -Force -ErrorAction SilentlyContinue)) {
            if (@('cmake') -notcontains $d.Name) { Remove-Tree $d.FullName }
          }
          # 静态导入库只留 libQt6EntryPoint.a（Qt6EntryPointPrivate 的导入目标指向它，缺了 Windows 侧 configure 直接失败）
          $entryPoint = "$env:HOST_PREFIX\lib\libQt6EntryPoint.a"
          $hasEntryPoint = Test-Path $entryPoint
          if ($hasEntryPoint) { Move-Item $entryPoint "$env:HOST_PREFIX\lib\_entrypoint.keep" -Force }
          Remove-Item "$env:HOST_PREFIX\lib\*.a" -Force -ErrorAction SilentlyContinue
          if ($hasEntryPoint) { Move-Item "$env:HOST_PREFIX\lib\_entrypoint.keep" $entryPoint -Force }
          # *.prl 保留：qmake 消费方的元数据，体积可忽略

          # 3) bin 白名单：cmake 引用集合（去掉已批准的排除项）+ 必需工具；其余 exe 一律删除
          #    必需集按实测 6.12.0 的 host/bin 清单写死（qmlcompiler/qmlsc/androidtestrunner6 在 6.12 中并不存在，
          #    写进断言会直接失败）
          $essential = @(
            'moc.exe', 'rcc.exe', 'uic.exe', 'qmake.exe', 'qmake6.exe', 'qtpaths.exe', 'qtpaths6.exe',
            'androiddeployqt.exe', 'androiddeployqt6.exe', 'androidtestrunner.exe',
            'cmake_automoc_parser.exe', 'qsb.exe', 'qmlcachegen.exe', 'qmlimportscanner.exe',
            'qmltyperegistrar.exe', 'qmltc.exe',
            'lrelease.exe', 'lrelease-pro.exe', 'lupdate.exe', 'lupdate-pro.exe', 'lconvert.exe'
          )
          # 已批准排除：其它平台部署器、DBus/帮助/文档/测试/分析工具、3D 美术工具、桌面 IDE
          # 排除只对"仅被 cmake 文本引用"的工具生效；被 Qt6*ToolsTargets 定义为导入目标的工具一律保留
          $excluded = @(
            'windeployqt.exe', 'windeployqt6.exe', 'wasmdeployqt.exe', 'wasmdeployqt6.exe',
            'harmonydeployqt.exe', 'harmonydeployqt6.exe', 'harmonyostestrunner.exe',
            'qdbuscpp2xml.exe', 'qdbusxml2cpp.exe', 'qdbus.exe', 'qdbusviewer.exe',
            'qhelpgenerator.exe', 'qtattributionsscanner.exe', 'svgtoqml.exe',
            'qmltestrunner.exe', 'qmlpreview.exe', 'qmlprofiler.exe', 'ltext2id.exe', 'lcheck.exe',
            'qmlaotstats.exe', 'qlalr.exe', 'qmlcontextpropertydump.exe', 'qcshadergen.exe', 'qvkgen.exe',
            'cooker.exe', 'balsam.exe', 'balsamui.exe', 'lightmapviewer.exe', 'meshdebug.exe',
            'materialeditor.exe', 'shadergen.exe', 'particleshadergen.exe', 'instancer.exe',
            'shapegen.exe', 'lottietoqml.exe',
            'designer.exe', 'assistant.exe', 'linguist.exe', 'qmlls.exe', 'qml.exe', 'qmlscene.exe',
            'qtdiag.exe', 'qtdiag6.exe', 'pixeltool.exe', 'qdistancefieldgenerator.exe',
            'qmleasing.exe', 'qtplugininfo.exe'
          )
          $excludedLc = @($excluded | ForEach-Object { $_.ToLowerInvariant() })
          # 导入目标是硬约束：find_package 会逐个校验 IMPORTED_LOCATION 指向的文件是否存在
          $hostToolTargets = @(Get-ChildItem "$env:HOST_PREFIX\lib\cmake" -Recurse -File -Force -Filter '*Targets*.cmake' |
            Where-Object { $_.Directory.Name -like 'Qt6*Tools*' })
          $importedLocs = @()
          foreach ($f in $hostToolTargets) {
            $t = [IO.File]::ReadAllText($f.FullName)
            foreach ($m in [regex]::Matches($t, '(?s)set_target_properties\(\s*(Qt6::[^\s]+?)\s+PROPERTIES(.*?)\n\s*\)')) {
              foreach ($p in [regex]::Matches($m.Groups[2].Value, 'IMPORTED_LOCATION(?:_[A-Z]+)?\s+"([^"]+)"')) {
                $importedLocs += @{ Target = $m.Groups[1].Value; Raw = $p.Groups[1].Value }
              }
            }
          }
          $importedExes = New-Object 'System.Collections.Generic.HashSet[string]'
          foreach ($l in $importedLocs) {
            $v = $l.Raw -replace '\\', '/'
            if ($v -match 'bin/([^/"]+\.exe)$') { [void]$importedExes.Add($Matches[1].ToLowerInvariant()) }
          }
          Write-Output ("导入目标 IMPORTED_LOCATION: {0} 处 / {1} 个 exe，扫描 {2} 个 Targets 文件（{3}）" -f
            $importedLocs.Count, $importedExes.Count, $hostToolTargets.Count,
            (($hostToolTargets | ForEach-Object { $_.Directory.Name } | Sort-Object -Unique) -join ', '))
          $keepNames = @()
          if ($tools -eq 'full') {
            Write-Output 'host_tools=full：保留 bin 全部文件，跳过白名单裁剪'
            $keepNames = @(Get-ChildItem "$env:HOST_PREFIX\bin" -File -Filter *.exe | ForEach-Object { $_.Name })
            $referenced = @()
            $brokenRefs = @()
          } else {
            $referenced = New-Object 'System.Collections.Generic.HashSet[string]'
            foreach ($f in @(Get-ChildItem "$env:HOST_PREFIX\lib\cmake" -Recurse -File -Force | Where-Object { $_.Extension -in '.cmake', '.json' })) {
              foreach ($m in [regex]::Matches((Get-Content $f.FullName -Raw), '(?<=bin/)[A-Za-z0-9_.+-]+\.exe')) {
                [void]$referenced.Add($m.Value.ToLowerInvariant())
              }
            }
            $keep = New-Object 'System.Collections.Generic.HashSet[string]'
            foreach ($n in $essential) { [void]$keep.Add($n.ToLowerInvariant()) }
            foreach ($n in $referenced) { if ($excludedLc -notcontains $n) { [void]$keep.Add($n) } }
            # 导入目标覆盖排除名单：find_package 会校验文件，缺了就是致命错误
            foreach ($n in $importedExes) { [void]$keep.Add($n) }
            $binCount = 0
            $binBytes = 0
            foreach ($f in @(Get-ChildItem "$env:HOST_PREFIX\bin" -File -Filter *.exe)) {
              if (-not $keep.Contains($f.Name.ToLowerInvariant())) {
                $binCount++; $binBytes += $f.Length
                Remove-Item $f.FullName -Force
              }
            }
            $removed += ,(@{ Name = 'bin (裁掉的 exe)'; Count = $binCount; Bytes = [double]$binBytes })
            $keepNames = @(Get-ChildItem "$env:HOST_PREFIX\bin" -File -Filter *.exe | ForEach-Object { $_.Name })
            $brokenRefs = @($referenced | Where-Object { $excludedLc -contains $_ -and -not $importedExes.Contains($_) } | Sort-Object)
            $missingEssential = @($essential | Where-Object { -not (Test-Path (Join-Path "$env:HOST_PREFIX\bin" $_)) })
            if ($missingEssential.Count -gt 0) { throw "白名单必需工具缺失：$($missingEssential -join ', ')" }
            Write-Output ("cmake 引用 exe: {0} 个；保留: {1} 个；按批准排除删除但仍被 cmake 引用: {2} 个（{3}）" -f
              $referenced.Count, $keepNames.Count, $brokenRefs.Count, ($brokenRefs -join ', '))
          }

          # 3.5) 硬校验：导入目标（exe/dll/py/目录）裁剪后必须仍存在
          $missingImports = @()
          foreach ($l in $importedLocs) {
            $v = ($l.Raw -replace '\\', '/') -replace '\$\{_IMPORT_PREFIX\}', ($env:HOST_PREFIX -replace '\\', '/')
            if ($v -match '\$\{') { continue }
            if ($v -match '^bin/') { $v = ($env:HOST_PREFIX -replace '\\', '/') + '/' + $v }
            if (-not (Test-Path -LiteralPath $v)) { $missingImports += ("{0} -> {1}" -f $l.Target, ($v -replace '/', '\')) }
          }
          if ($missingImports.Count -gt 0) {
            throw "host 前缀裁剪后缺少导入目标文件:`n$($missingImports -join "`n")"
          }
          Write-Output ("导入目标文件校验通过：{0} 处（{1} 个 Targets 文件）" -f $importedLocs.Count, $hostToolTargets.Count)

          # 4) 自检：缺运行库 DLL 时 Windows 返回 0xC0000135 / 0xC0000139
          $smoke = @(
            @('qmake.exe', '-query', 'QT_VERSION'), @('moc.exe', '--version'), @('rcc.exe', '--help'),
            @('uic.exe', '--help'), @('qsb.exe', '--version'), @('qmltyperegistrar.exe', '--help'),
            @('qmlcachegen.exe', '--help'), @('qmlimportscanner.exe'), @('androiddeployqt.exe', '--help'),
            @('qtpaths.exe', '-query', 'QT_VERSION')
          )
          foreach ($cmd in $smoke) {
            $exe = Join-Path $env:HOST_PREFIX "bin\$($cmd[0])"
            if (-not (Test-Path $exe)) { throw "裁剪后缺少工具 $($cmd[0])（可用 host_tools=full 复跑对比）" }
            & $exe @($cmd[1..($cmd.Count - 1)]) 2>&1 | Out-Null
            if ($LASTEXITCODE -in @(-1073741515, -1073741511)) { throw "精简后 $($cmd[0]) 无法运行（缺运行库 DLL）" }
          }

          $afterCount = (Get-ChildItem $env:HOST_PREFIX -Recurse -File -Force | Measure-Object).Count
          $afterSize = (Get-ChildItem $env:HOST_PREFIX -Recurse -File -Force | Measure-Object Length -Sum).Sum
          if (-not $afterSize) { $afterSize = 0 }
          $removedBytes = ($removed | Measure-Object -Property Bytes -Sum).Sum
          if (-not $removedBytes) { $removedBytes = 0 }
          $msg = "host 前缀精简({0}): {1:N0} MB / {2} 文件 -> {3:N0} MB / {4} 文件（省 {5:N0} MB）" -f
            $tools, ($beforeSize / 1MB), $beforeCount, ($afterSize / 1MB), $afterCount, ($removedBytes / 1MB)
          Write-Output $msg
          $msg | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $report = @(
            "host_tools 模式: $tools",
            $msg,
            ("删除明细: {0} 项 / {1} 个文件" -f $removed.Count, (($removed | Measure-Object -Property Count -Sum).Sum))
          )
          foreach ($r in @($removed | Sort-Object -Property Bytes -Descending)) {
            if ($r.Count -gt 0) { $report += ("  {0,-26} {1,5} 个 {2,8:N1} MB" -f $r.Name, $r.Count, ($r.Bytes / 1MB)) }
          }
          $report += @('', ("保留的 host 工具（{0} 个）: {1}" -f $keepNames.Count, (@($keepNames | Sort-Object) -join ', ')))
          if ($brokenRefs.Count -gt 0) {
            $report += @('', ("被 cmake 引用但按批准排除删除（{0} 个）: {1}" -f $brokenRefs.Count, ($brokenRefs -join ', ')))
          }
          Set-Content -Path "$env:WORK_ROOT\prune-report.txt" -Value $report -Encoding utf8

      - name: Relocate prefixes (relative paths only)
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $t = [Diagnostics.Stopwatch]::StartNew()
          $root = $env:WORK_ROOT
          $hLeaf = Split-Path $env:HOST_PREFIX -Leaf
          $hAbs = $env:HOST_PREFIX -replace '\\', '/'
          $script:patches = 0
          $script:touched = New-Object System.Collections.Generic.List[string]

          function Save([string]$path, [string]$text) {
            [IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
            $script:patches++
            $script:touched.Add($path.Substring($env:WORK_ROOT.Length + 1))
          }

          # 1) target/bin/*.bat 里写死了 host 工具的绝对路径；qt.conf/批处理的相对基准是文件所在目录，
          #    从 bin 上溯两层的正好是两个前缀的父目录
          foreach ($name in 'qmake', 'qmake6', 'qtpaths', 'qtpaths6') {
            $p = "$env:TARGET_PREFIX\bin\$name.bat"
            if (-not (Test-Path $p)) { continue }
            $txt = [IO.File]::ReadAllText($p)
            $m = [regex]::Match($txt, '(?m)^(?<tok>"[^"]+"|\S+\.exe)')
            if (-not $m.Success) { continue }
            $tok = $m.Groups['tok'].Value.Trim('"')
            if ($tok -notmatch '^[A-Za-z]:') { continue }
            $new = '"%~dp0..\..\' + $hLeaf + '\bin\' + (Split-Path $tok -Leaf) + '"'
            Save $p ($txt.Substring(0, $m.Groups['tok'].Index) + $new +
              $txt.Substring($m.Groups['tok'].Index + $m.Groups['tok'].Length))
          }

          # 2) Qt6Dependencies.cmake：本文件在 <prefix>/lib/cmake/Qt6，从 Qt6_DIR 上溯四层即两个前缀的父目录
          #    （Qt6_DIR 由 find_package 在消费方设置，因此改写后随前缀移动仍然有效）
          $dep = "$env:TARGET_PREFIX\lib\cmake\Qt6\Qt6Dependencies.cmake"
          if (Test-Path $dep) {
            $txt = [IO.File]::ReadAllText($dep)
            $orig = $txt
            $txt = $txt.Replace('"' + $hAbs + '/lib/cmake"', '"${Qt6_DIR}/../../../../' + $hLeaf + '/lib/cmake"')
            $txt = $txt.Replace('"' + $hAbs + '"', '"${Qt6_DIR}/../../../../' + $hLeaf + '"')
            if ($txt -ne $orig) { Save $dep $txt }
          }

          # 3) QtBuildInternalsExtra.cmake：原始安装前缀改为相对本文件；源码树与 OpenSSL 头文件目录置空
          #    该文件由配置期变量动态生成（QtPostProcessHelpers.cmake:579-788），行号不固定
          #    OPENSSL_ROOT_DIR 置空而非相对化：包内不分发头文件，且非空值会让下游 FindOpenSSL 走 NO_DEFAULT_PATH
          #    其余动态注入路径（FFMPEG_DIR、QT_INTERNAL_EXAMPLES_INSTALL_PREFIX、QT_EXTRA_*、RPATH 等）走通用兜底相对化
          $rootForms = @($root, ($root -replace '\\', '/'))
          $script:rootAbs = $root -replace '\\', '/'
          $script:rootPat = '(?i)(' + (($rootForms | ForEach-Object { [regex]::Escape($_) }) -join '|') +
            ')(?=[/\\"\s'';),]|$)(?<rest>[/\\][^"\s'';)]*)?'
          function ConvertTo-CmakeRelative([string]$filePath, [string]$text) {
            $fileDir = $filePath -replace '\\', '/'
            $fileDir = $fileDir.Substring(0, $fileDir.LastIndexOf('/'))
            $dirParts = @($fileDir -split '/')
            $sb = New-Object System.Text.StringBuilder
            $pos = 0
            foreach ($m in [regex]::Matches($text, $script:rootPat)) {
              $absParts = @((($script:rootAbs + $m.Groups['rest'].Value) -replace '\\', '/').TrimEnd('/') -split '/')
              $n = 0
              while ($n -lt $dirParts.Count -and $n -lt $absParts.Count -and $dirParts[$n] -ieq $absParts[$n]) { $n++ }
              $rel = @()
              for ($k = $n; $k -lt $dirParts.Count; $k++) { $rel += '..' }
              for ($k = $n; $k -lt $absParts.Count; $k++) { $rel += $absParts[$k] }
              [void]$sb.Append($text.Substring($pos, $m.Index - $pos))
              [void]$sb.Append('${CMAKE_CURRENT_LIST_DIR}/' + ($rel -join '/'))
              $pos = $m.Index + $m.Length
            }
            if ($pos -eq 0) { return $text }
            [void]$sb.Append($text.Substring($pos))
            return $sb.ToString()
          }
          foreach ($p in @("$env:TARGET_PREFIX\lib\cmake\Qt6BuildInternals\QtBuildInternalsExtra.cmake",
                           "$env:HOST_PREFIX\lib\cmake\Qt6BuildInternals\QtBuildInternalsExtra.cmake")) {
            if (-not (Test-Path $p)) { continue }
            $txt = [IO.File]::ReadAllText($p)
            $orig = $txt
            $txt = [regex]::Replace($txt, '(?m)^\s*set\(qtbi_orig_prefix "[^"]*"\)',
              'set(qtbi_orig_prefix "${CMAKE_CURRENT_LIST_DIR}/../../..")')
            $txt = [regex]::Replace($txt, '(?m)^\s*set\(QT_SOURCE_TREE "[^"]*" CACHE PATH',
              'set(QT_SOURCE_TREE "" CACHE PATH')
            $txt = [regex]::Replace($txt, '(?m)^\s*set\(OPENSSL_ROOT_DIR "[^"]*" CACHE (STRING|PATH)',
              'set(OPENSSL_ROOT_DIR "" CACHE $1')
            $txt = ConvertTo-CmakeRelative $p $txt
            if ($txt -ne $orig) { Save $p $txt }
          }

          # 4) mkspecs/modules/qt_ext_*.pri：第三方头文件目录指向构建期源码树，源码不随包分发，置空
          foreach ($dir in @("$env:TARGET_PREFIX\mkspecs\modules", "$env:HOST_PREFIX\mkspecs\modules")) {
            foreach ($p in @(Get-ChildItem $dir -Filter 'qt_ext_*.pri' -File -ErrorAction SilentlyContinue)) {
              $txt = [IO.File]::ReadAllText($p.FullName)
              $orig = $txt
              $txt = [regex]::Replace($txt, '(?m)^(QMAKE_INCDIR_[A-Za-z0-9_]+)\s*=\s*[A-Za-z]:[/\\].*$', '$1 =')
              if ($txt -ne $orig) { Save $p.FullName $txt }
            }
          }

          # 5) target_qt.conf 不改写，只按真实布局校验（HostPrefix 相对 bin/，HostData 相对 HostPrefix）
          $conf = "$env:TARGET_PREFIX\bin\target_qt.conf"
          if (-not (Test-Path $conf)) { throw "缺少 $conf" }
          $kv = @{}
          Get-Content $conf | ForEach-Object {
            if ($_ -match '^\s*([^#=\[]+?)\s*=\s*(.*)$') { $kv[$matches[1]] = $matches[2].Trim() }
          }
          $expectHost = "../../$hLeaf"
          if ($kv['HostPrefix'] -ne $expectHost) {
            throw "target_qt.conf 的 HostPrefix=$($kv['HostPrefix']) 与布局不符（期望 $expectHost）"
          }
          $expectData = "../" + (Split-Path $env:TARGET_PREFIX -Leaf)
          if ($kv['HostData'] -and $kv['HostData'] -ne $expectData) {
            throw "target_qt.conf 的 HostData=$($kv['HostData']) 与布局不符（期望 $expectData）"
          }
          # 同时确认它解出来的真实路径就是 host 前缀（HostPrefix 的相对基准是 bin/，防相对层数算错）
          $resolved = (Resolve-Path (Join-Path "$env:TARGET_PREFIX\bin" ($kv['HostPrefix'] -replace '/', '\'))).Path
          if ($resolved -ne (Resolve-Path $env:HOST_PREFIX).Path) {
            throw "target_qt.conf 的 HostPrefix 解析到 $resolved，与 $env:HOST_PREFIX 不一致"
          }

          # 6) 硬校验：交付前缀内不允许再出现 WORK_ROOT 的绝对形式（两种斜杠都查）
          $exts = @('.cmake', '.conf', '.pri', '.prl', '.bat', '.py', '.txt', '.json', '.qmltypes', '.qml', '.js')
          $pats = @($root, ($root -replace '\\', '/'))
          $left = @(Get-ChildItem $env:TARGET_PREFIX, $env:HOST_PREFIX -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $exts -contains $_.Extension.ToLower() } |
            Select-String -SimpleMatch -Pattern $pats)
          if ($left.Count -gt 0) {
            $where = @($left | ForEach-Object { $_.Path.Substring($root.Length + 1) + ":$($_.LineNumber)" } |
              Sort-Object -Unique | Select-Object -First 20)
            throw "重定位校验失败：仍有 $($left.Count) 处绝对路径`n$($where -join "`n")"
          }

          "RELOC_PATCHES=$script:patches" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELOC_LEFT=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T_RELOCATE={0:N1}" -f $t.Elapsed.TotalSeconds | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "重定位完成：改写 $script:patches 处，校验 0 命中；涉及文件："
          $script:touched | Sort-Object -Unique | ForEach-Object { Write-Output "  $_" }

      - name: Smoke host tools (minimal Android project configure)
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 只做 cmake 配置（不编译、不打 APK）：验证裁剪后的 host 前缀能被 find_package(Qt6) 与 QML 链路消费
          $proj = "$env:WORK_ROOT\smoke-app"
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          @'
          cmake_minimum_required(VERSION 3.21)
          project(smoke LANGUAGES CXX)
          find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets Qml Quick QuickControls2)
          qt_standard_project_setup()
          qt_add_executable(smoke main.cpp)
          qt_add_qml_module(smoke URI Smoke VERSION 1.0 QML_FILES Main.qml)
          target_link_libraries(smoke PRIVATE Qt6::Widgets Qt6::Quick)
          '@ | Set-Content -Path "$proj\CMakeLists.txt" -Encoding utf8
          @'
          #include <QApplication>
          #include <QQmlApplicationEngine>
          int main(int argc, char **argv) {
            QApplication app(argc, argv);
            QQmlApplicationEngine engine;
            engine.load(QUrl(QStringLiteral("qrc:/qt/qml/Smoke/Main.qml")));
            return app.exec();
          }
          '@ | Set-Content -Path "$proj\main.cpp" -Encoding utf8
          @'
          import QtQuick
          Item { width: 200; height: 200 }
          '@ | Set-Content -Path "$proj\Main.qml" -Encoding utf8

          # 先报缺工具名，再跑 androiddeployqt --help
          $need = @('moc.exe', 'rcc.exe', 'uic.exe', 'qmake.exe', 'qtpaths.exe', 'androiddeployqt.exe',
            'qsb.exe', 'qmlcachegen.exe', 'qmlimportscanner.exe', 'qmltyperegistrar.exe', 'qmltc.exe',
            'lrelease.exe', 'lupdate.exe', 'lconvert.exe', 'cmake_automoc_parser.exe')
          $miss = @($need | Where-Object { -not (Test-Path (Join-Path "$env:HOST_PREFIX\bin" $_)) })
          if ($miss.Count -gt 0) { throw "裁剪后缺少工具：$($miss -join ', ')（可用 host_tools=full 复跑对比）" }
          # androiddeployqt --help 按设计返回 1（main.cpp 的 SyntaxErrorOrHelpRequested），帮助文本写 stderr
          # 以 "Syntax: androiddeployqt" 开头；用退出码集合 + 帮助文本共同判定，能证明 exe 与 Qt6Core 依赖齐全
          $adqOut = (& "$env:HOST_PREFIX\bin\androiddeployqt.exe" --help 2>&1 | Out-String)
          $adqExit = $LASTEXITCODE
          if ($adqExit -notin @(0, 1) -or $adqOut -notmatch 'Syntax: androiddeployqt') {
            throw "androiddeployqt --help 异常: exit=$adqExit, 输出=$($adqOut.Trim())"
          }

          # target 前缀的 CMake 包缺失时，find_package 的报错与"路径被 re-root"难以区分，先显式断言
          $tc = "$env:TARGET_PREFIX\lib\cmake\Qt6\qt.toolchain.cmake"
          $pkg = "$env:TARGET_PREFIX\lib\cmake\Qt6\Qt6Config.cmake"
          foreach ($f in @($tc, $pkg)) { if (-not (Test-Path $f)) { throw "target 前缀缺少 CMake 包文件：$f" } }
          $build = "$env:WORK_ROOT\smoke-build"
          Remove-Item $build -Recurse -Force -ErrorAction SilentlyContinue
          $log = "$env:WORK_ROOT\smoke-configure.log"
          # 用 Qt 自带工具链：它 chainload NDK 工具链，并把 lib/cmake 加进 PREFIX_PATH、安装前缀加进 FIND_ROOT_PATH，
          # 规避 cmake find_package 的 re-root 拼接问题（qt.toolchain.cmake.in:177-184）
          $cfgArgs = @('-S', $proj, '-B', $build, '-G', 'Ninja',
            "-DCMAKE_TOOLCHAIN_FILE=$tc",
            "-DQT_CHAINLOAD_TOOLCHAIN_FILE=$env:ANDROID_NDK_ROOT\build\cmake\android.toolchain.cmake",
            "-DANDROID_ABI=$($env:QT_ABI)", '-DANDROID_PLATFORM=android-23',
            "-DCMAKE_PREFIX_PATH=$($env:TARGET_PREFIX)",
            "-DQT_HOST_PATH=$($env:HOST_PREFIX)")
          & cmake @cfgArgs 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content $log -Tail 40) -join "`n"
            throw "冒烟配置失败（exit $LASTEXITCODE）：`n$tail"
          }
          Write-Output '冒烟配置通过：find_package(Qt6: Core/Gui/Widgets/Qml/Quick/QuickControls2) 与 QML 模块解析正常'
          $hits = @(Select-String -Path $log -Pattern 'does not exist|Could not find' -SimpleMatch:$false)
          if ($hits.Count -gt 0) { Write-Output ("注意：日志含缺失告警 {0} 条" -f $hits.Count) }

          # 不传 QT_HOST_PATH 再配置一次：这是"相对路径真的生效"的证据（找不到 host 就会失败）
          $build2 = "$env:WORK_ROOT\smoke-build-nohost"
          Remove-Item $build2 -Recurse -Force -ErrorAction SilentlyContinue
          $log2 = "$env:WORK_ROOT\smoke-configure-nohost.log"
          $cfg2 = @('-S', $proj, '-B', $build2, '-G', 'Ninja',
            "-DCMAKE_TOOLCHAIN_FILE=$tc",
            "-DQT_CHAINLOAD_TOOLCHAIN_FILE=$env:ANDROID_NDK_ROOT\build\cmake\android.toolchain.cmake",
            "-DANDROID_ABI=$($env:QT_ABI)", '-DANDROID_PLATFORM=android-23',
            "-DCMAKE_PREFIX_PATH=$($env:TARGET_PREFIX)")
          & cmake @cfg2 2>&1 | Tee-Object -FilePath $log2
          if ($LASTEXITCODE -ne 0) {
            # 失败时直接指出还在指绝对路径的位置，避免只看到一句 could not find
            $bad = @(Get-ChildItem "$env:TARGET_PREFIX\lib\cmake" -Recurse -Filter '*.cmake' -File |
              Select-String -Pattern '"[A-Za-z]:[/\\]' |
              ForEach-Object { $_.Path + ":$($_.LineNumber): " + $_.Line.Trim() })
            $tail = (Get-Content $log2 -Tail 30) -join "`n"
            throw ("不传 QT_HOST_PATH 的配置失败（exit $LASTEXITCODE）：相对路径没落对。`n" +
              "仍含绝对路径（$($bad.Count) 处）：`n$($bad -join "`n")`n日志尾部：`n$tail")
          }
          $qho = Select-String -Path "$build2\CMakeCache.txt" -Pattern '^Qt6HostInfo_DIR:PATH=' | Select-Object -First 1
          if (-not $qho) { throw '配置通过但 CMakeCache 无 Qt6HostInfo_DIR：host 信息包未被解析' }
          Write-Output "相对路径生效：不传 -DQT_HOST_PATH 也能解析 host（$($qho.Line)）"

      - name: Write BUILD-INFO.txt
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Text([string]$Path) {
            if (Test-Path $Path) { (Get-Content $Path -Raw).TrimStart([char]0xFEFF).Trim() } else { 'n/a（未执行/未记录）' }
          }
          function Get-Cmd([string]$Exe, [string[]]$Argv) {
            try { (& $Exe @Argv 2>&1 | Out-String).Trim() } catch { "执行失败: $($_.Exception.Message)" }
          }
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $ndkProps = Join-Path $env:ANDROID_NDK_ROOT 'source.properties'
          $ndkRev = if (Test-Path $ndkProps) { (Select-String -Path $ndkProps -Pattern '^Pkg.Revision' | Select-Object -First 1).Line } else { 'n/a' }
          $hostMode = "源码自建（链接方式 $env:HOST_LINKAGE）"
          $hostModules = $env:HOST_KEEP_MODULES
          $hostCfg = Get-Text "$env:WORK_ROOT\host-configure.txt"
          $mingw = Get-Cmd 'gcc' @('--version')
          $phase = {
            param($key, $label)
            $v = [Environment]::GetEnvironmentVariable($key)
            if ($v) { "{0}: {1:N1} 分钟（{2} 秒）" -f $label, ([double]$v / 60), $v } else { "{0}: 未记录" -f $label }
          }
          $adqHelp = (Get-Cmd "$env:HOST_PREFIX\bin\androiddeployqt.exe" @('--help')) -split "`n" | Select-Object -First 5
          # target 安装包里的图像插件清单，便于首轮 CI 核对 -no-feature-tiff 的实际效果
          $imgDir = Join-Path $env:TARGET_PREFIX 'plugins\imageformats'
          $imgLines = if (Test-Path $imgDir) {
            @(Get-ChildItem $imgDir -File | Sort-Object Name | ForEach-Object {
              '  {0} ({1:N1} KB)' -f $_.Name, ($_.Length / 1KB)
            })
          } else { @('  n/a（目录不存在）') }
          # 裁剪记录只搬数量与总大小：明细行数可达上千，不整体塞进 BUILD-INFO
          $pruneLines = if (Test-Path "$env:WORK_ROOT\prune-report.txt") {
            @(Get-Content "$env:WORK_ROOT\prune-report.txt" -Encoding utf8 |
              Where-Object { $_ -match '^(host_tools 模式|host 前缀精简|删除明细)' } |
              ForEach-Object { '  ' + $_ })
          } else { @('  n/a（未执行裁剪）') }
          # SSL 状态取产物里的实际 feature 值，避免只写"以为"的值
          $netCfg = Join-Path $env:TARGET_PREFIX 'include\QtNetwork\qtnetwork-config.h'
          $sslFeature = if (Test-Path $netCfg) {
            $m = Select-String -Path $netCfg -Pattern '^#define QT_FEATURE_ssl ' | Select-Object -First 1
            if ($m) { ($m.Line -split '\s+')[-1] } else { 'n/a' }
          } else { 'n/a（文件不存在）' }
          $lines = @(
            'Qt for Android 构建环境与参数',
            '编码: UTF-8 with BOM（Windows 记事本可直接打开）',
            "生成时间: $now",
            "工作流: $env:GITHUB_WORKFLOW / run $env:GITHUB_RUN_NUMBER / $env:GITHUB_SHA",
            '',
            '[Qt]',
            "版本: $env:QT_VERSION",
            "ABI: $env:QT_ABI",
            "host 来源: $hostMode",
            "skip 项: $env:QT_SKIP_MODULES",
            "host 生效模块: $hostModules",
            "重定位: 绝对路径改写 $env:RELOC_PATCHES 处 / 校验 $env:RELOC_LEFT 命中",
            "SSL: runtime（QT_FEATURE_ssl=$sslFeature，未随包分发 TLS 库；头文件 openssl-$env:OPENSSL_VERSION 由 Configure($env:OPENSSL_CONFIGURE_TARGET) + util/dofile.pl 生成；" +
              "host 侧保持 -no-openssl -schannel，属有意不一致；下游需自带 libssl_3.so / libcrypto_3.so）",
            '',
            '[configure 命令]',
            "host: $hostCfg",
            "target: $(Get-Text "$env:WORK_ROOT\target-configure.txt")",
            '',
            '[工具链]',
            "NDK: $env:NDK_VERSION（$ndkRev）",
            "SDK platform: $env:SDK_PLATFORM",
            "build-tools: $env:SDK_BUILD_TOOLS",
            "cmdline-tools: $env:CMDLINE_TOOLS_VERSION",
            "JDK: $(Get-Cmd 'java' @('-version'))",
            "CMake: $(Get-Cmd 'cmake' @('--version'))",
            "Ninja: $(Get-Cmd 'ninja' @('--version'))",
            "MinGW: $mingw",
            "Python: $(Get-Cmd 'python' @('--version'))",
            "Perl: $(Get-Cmd 'perl' @('-e', 'print $^V'))",
            "7-Zip: $(Get-Cmd $env:SEVEN_ZIP @('i'))",
            '',
            '[运行环境]',
            "runner: $env:RUNNER_NAME（$env:RUNNER_OS/$env:RUNNER_ARCH）",
            "OS: $($os.Caption) $($os.Version)（ImageOS=$env:ImageOS, ImageVersion=$env:ImageVersion）",
            "CPU: $($cpu.Name) / $env:NUMBER_OF_PROCESSORS 逻辑核",
            "内存: $([math]::Round($os.TotalVisibleMemorySize / 1MB, 1)) GB",
            "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE",
            "WORK_ROOT: $env:WORK_ROOT",
            '',
            '[阶段耗时]',
            (& $phase 'T_FETCH' '源码下载+解压'),
            (& $phase 'T_OPENSSL_HEADERS' 'OpenSSL 头文件准备'),
            (& $phase 'T_HOST_CONFIGURE' 'host configure'),
            (& $phase 'T_HOST_BUILD' 'host build'),
            (& $phase 'T_HOST_INSTALL' 'host 安装（install + strip）'),
            (& $phase 'T_GRADLE_PREP' 'Gradle 缓存准备'),
            (& $phase 'T_TARGET_CONFIGURE' 'target configure'),
            (& $phase 'T_TARGET_BUILD' 'target build'),
            (& $phase 'T_TARGET_INSTALL' 'target install'),
            (& $phase 'T_RELOCATE' '重定位（相对路径改写）'),
            '',
            '[裁剪记录]',
            $pruneLines,
            '',
            '[产物自检]',
            "qmake -query QT_VERSION: $(Get-Cmd "$env:HOST_PREFIX\bin\qmake.exe" @('-query', 'QT_VERSION'))",
            "moc --version: $(Get-Cmd "$env:HOST_PREFIX\bin\moc.exe" @('--version'))",
            "qsb --version: $(Get-Cmd "$env:HOST_PREFIX\bin\qsb.exe" @('--version'))",
            "qtpaths -query QT_VERSION: $(Get-Cmd "$env:HOST_PREFIX\bin\qtpaths.exe" @('-query', 'QT_VERSION'))",
            'androiddeployqt --help（前 5 行）:'
          ) + @($adqHelp)
          $lines += @('', "[target 图像格式插件]（$($imgLines.Count) 项）") + @($imgLines)
          # Set-Content -Encoding utf8 在 Windows PowerShell 下写 UTF-8 with BOM
          Set-Content -Path "$env:WORK_ROOT\BUILD-INFO.txt" -Value $lines -Encoding utf8
          Write-Output "已生成 BUILD-INFO.txt（$(($lines | Measure-Object).Count) 行）"

      - name: Package artifact
        if: env.HOST_ONLY != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 同时打包 target 前缀、host 前缀与 BUILD-INFO.txt：target/bin/target_qt.conf 的 HostPrefix 是相对路径
          # （qtbase/cmake/QtQmakeHelpers.cmake:108），两个目录保持同级即可继续解析到 host 工具
          foreach ($dir in @($env:TARGET_PREFIX, $env:HOST_PREFIX)) {
            $size = (Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum
            "{0}: {1:N0} MB" -f $dir, ($size / 1MB)
          }
          $archive = "$env:WORK_ROOT\qt-$env:QT_VERSION-android-$env:QT_ABI-windows-host.7z"
          Push-Location $env:WORK_ROOT
          try {
            # -mx=9 等价 LZMA2:d256m + solid，对齐 Fs 产物的 LZMA2:28+BCJ（实测压缩率 ~9.7x vs mx=5 的 5.5x）
            # 代价：该步骤从约 4 分钟涨到 10–15 分钟（job 级 timeout 360 分钟已够）
            # -x! 排除 host 前缀里的缓存标记文件（它必须留在前缀中，见 Prune 步骤注释）
            & $env:SEVEN_ZIP a -t7z -mx=9 -ms=on '-x!.cache-ok' $archive 'BUILD-INFO.txt' (Split-Path $env:TARGET_PREFIX -Leaf) (Split-Path $env:HOST_PREFIX -Leaf)
            if ($LASTEXITCODE -ne 0) { throw '7z 打包失败' }
          } finally {
            Pop-Location
          }
          "{0:N0} MB" -f ((Get-Item $archive).Length / 1MB)
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB, 1)}} |
            Format-Table

      - name: Upload artifact
        if: env.HOST_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: qt-${{ env.QT_VERSION }}-android-${{ env.QT_ABI }}-windows-host
          path: |
            D:\qt\qt-${{ env.QT_VERSION }}-android-${{ env.QT_ABI }}-windows-host.7z
            D:\qt\manifest.json
          compression-level: 0
          retention-days: 14

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/') && env.HOST_ONLY != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: D:\qt\qt-${{ env.QT_VERSION }}-android-${{ env.QT_ABI }}-windows-host.7z

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $fmt = {
            param($key, $label)
            $v = [Environment]::GetEnvironmentVariable($key)
            if ($v) { "{0}: {1:N1} 分钟" -f $label, ([double]$v / 60) } else { "{0}: 未记录" -f $label }
          }
          $lines = @(
            "Qt: $env:QT_VERSION",
            "Modules skipped: $env:QT_SKIP_MODULES",
            "ABI: $env:QT_ABI",
            "NDK: $env:NDK_VERSION",
            "SDK platform: $env:SDK_PLATFORM",
            "Build tools: $env:SDK_BUILD_TOOLS",
            "Host prefix: $env:HOST_PREFIX",
            "Host 来源: 源码自建（本工作流 host 阶段编译）",
            "Host 链接: $env:HOST_LINKAGE",
            "Host 生效模块: $env:HOST_KEEP_MODULES",
            "Target prefix: $env:TARGET_PREFIX",
            "",
            "## 阶段耗时",
            (& $fmt 'T_FETCH' '源码下载+解压'),
            (& $fmt 'T_OPENSSL_HEADERS' 'OpenSSL 头文件准备'),
            (& $fmt 'T_HOST_CONFIGURE' 'host configure'),
            (& $fmt 'T_HOST_BUILD' 'host build'),
            (& $fmt 'T_HOST_INSTALL' 'host 安装（install + strip）'),
            (& $fmt 'T_GRADLE_PREP' 'Gradle 缓存准备'),
            (& $fmt 'T_TARGET_CONFIGURE' 'target configure'),
            (& $fmt 'T_TARGET_BUILD' 'target build'),
            (& $fmt 'T_TARGET_INSTALL' 'target install')
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
